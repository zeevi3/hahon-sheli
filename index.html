    // Pull from "ההון שלי" — READ ONLY, never writes back.
    // New names → create an account (+ today's value as opening point).
    // Existing accounts → add/refresh a value record for today.
    function RtImportSheet({ accounts, onImport, onClose }) {
      const [rows, setRows] = useState(() => {
        const wealth = loadState(); // read-only peek at the wealth app's state
        const byName = new Map(accounts.map(a => [a.name, a]));
        const items = [];
        const guessGroup = (cat, name) => {
          if (name.includes('השתלמות')) return 'hishtalmut';
          if (name.includes('גמל')) return 'gemel';
          if (name.includes('ילד')) return 'kids';
          if (cat === 'crypto') return 'crypto';
          if (cat === 'stocks') return 'broker';
          return 'other';
        };
        ['savings', 'stocks', 'crypto', 'bank'].forEach(cat => {
          (wealth.current[cat] || []).forEach(item => {
            const name = item.name || '';
            if (!name) return;
            const isUsd = cat === 'bank' && item.currency === 'USD';
            const srcCur = isUsd ? 'USD' : 'ILS';
            const value = cat === 'crypto' ? (item.marketValue || 0)
              : cat === 'bank' ? (item.foreignAmount ?? item.value ?? 0)
              : (item.value || 0);
            const existing = byName.get(name);
            if (existing) {
              const mismatch = existing.currency !== srcCur;
              items.push({
                name, mode: 'update', existingId: existing.id,
                currency: existing.currency, value,
                mismatch, checked: !mismatch,
              });
            } else {
              items.push({
                name, mode: 'create', checked: cat !== 'bank',
                group: guessGroup(cat, name), currency: srcCur,
                owner: item.person || '', value,
              });
            }
          });
        });
        return items;
      });
      const set = (i, k, v) => setRows(p => p.map((r, j) => j === i ? { ...r, [k]: v } : r));
      const picked = rows.filter(r => r.checked && !r.mismatch);
      const nCreate = picked.filter(r => r.mode === 'create').length;
      const nUpdate = picked.filter(r => r.mode === 'update').length;
      const btnLabel = [
        nCreate ? `${nCreate} חשבונות חדשים` : null,
        nUpdate ? `שווי להיום ל־${nUpdate} קיימים` : null,
      ].filter(Boolean).join(' + ') || 'לא נבחר כלום';
      return (
        <RtSheet title="שאיבה מההון שלי (קריאה בלבד)" onClose={onClose}>
          <div style={{ fontSize: 12, color: 'var(--ink-3)', marginBottom: 14, lineHeight: 1.6 }}>
            נכס חדש → נוצר חשבון עם שווי פתיחה של היום. נכס שכבר קיים כחשבון → נרשם לו שווי חדש לתאריך של היום.
            שום דבר לא נכתב חזרה להון שלי.
          </div>
          {rows.length === 0 && <div style={{ fontSize: 13, color: 'var(--ink-3)' }}>לא נמצאו נכסים.</div>}
          {rows.map((r, i) => (
            <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'center', padding: '8px 0',
                                  borderBottom: '1px solid var(--border-2)', flexWrap: 'wrap',
                                  opacity: r.mismatch ? 0.55 : 1 }}>
              <input type="checkbox" checked={r.checked} disabled={r.mismatch}
                onChange={e => set(i, 'checked', e.target.checked)} />
              <span style={{ flex: '1 1 140px', fontSize: 13, fontWeight: 500 }}>
                {r.name}
                {r.mismatch && <span style={{ fontSize: 10, color: '#92400E' }}> · מטבע שונה מהחשבון — דלג</span>}
              </span>
              {r.mode === 'update' ? (
                <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--accent)',
                               background: '#F0FDF7', border: '1px solid #A7F3D0',
                               borderRadius: 999, padding: '2px 10px' }}>
                  עדכון שווי להיום
                </span>
              ) : (
                <>
                  <select className="rt-select" style={{ width: 130 }} value={r.group}
                    onChange={e => set(i, 'group', e.target.value)}>
                    {RT_GROUPS.map(g => <option key={g.id} value={g.id}>{g.label}</option>)}
                  </select>
                  <select className="rt-select" style={{ width: 70 }} value={r.currency}
                    onChange={e => set(i, 'currency', e.target.value)}>
                    <option value="ILS">₪</option><option value="USD">$</option>
                  </select>
                  <input className="rt-input" style={{ width: 90 }} placeholder="בעלים" value={r.owner}
                    onChange={e => set(i, 'owner', e.target.value)} />
                </>
              )}
              <span className="rt-num" style={{ fontSize: 12, color: 'var(--ink-3)', minWidth: 80, textAlign: 'left' }}>
                {rtFmt(r.value, r.currency)}
              </span>
            </div>
          ))}
          <div style={{ marginTop: 16 }}>
            <button className="rt-btn" disabled={!picked.length}
              style={{ opacity: picked.length ? 1 : 0.5 }}
              onClick={() => onImport(picked)}>
              שאב: {btnLabel}
            </button>
          </div>
        </RtSheet>
      );
    }

    // ── Excel/CSV import — deterministic, in-browser, nothing leaves the device ──
    async function rtLoadXlsx() {
      if (!window.XLSX) {
        await rtLoadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
      }
      return window.XLSX;
    }
    // 'YYYY-MM-DD' from a spreadsheet cell: Date object, Excel serial, or dd/mm/yyyy-style string
    function rtParseDateCell(v) {
      const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (v instanceof Date) return isNaN(v) ? null : iso(v);
      if (typeof v === 'number' && v > 20000 && v < 80000) {
        const d = new Date(Math.round((v - 25569) * 86400000));
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
      }
      if (v == null) return null;
      const s = String(v).trim();
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/); // Israeli exports: day first
      if (m) {
        let y = +m[3]; if (y < 100) y += 2000;
        const mo = +m[2], d = +m[1];
        if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1990 || y > 2100) return null;
        return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }
      return null;
    }
    function rtParseNumCell(v) {
      if (typeof v === 'number') return isFinite(v) ? v : null;
      if (v == null) return null;
      let s = String(v).replace(/[₪$€,\s]/g, '').replace(/−/g, '-');
      if (!s) return null;
      let neg = false;
      if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); } // (1,234) = negative
      const n = parseFloat(s);
      return isFinite(n) ? (neg ? -n : n) : null;
    }
    function rtColName(i) {
      let s = ''; i++;
      while (i) { i--; s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26); }
      return s;
    }

    function RtXlsImportSheet({ rt, onImportRecords, onSaveMap, onClose }) {
      const accounts = rt.accounts.filter(a => a.active !== false);
      const [step, setStep] = useState('file'); // file | map
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const [fileName, setFileName] = useState('');
      const [sheets, setSheets] = useState([]); // [{ name, rows: [][] }]
      const [sheetIdx, setSheetIdx] = useState(0);
      const [map, setMap] = useState({ type: 'flows', dateCol: 0, amountCol: 1, kindMode: 'sign', date: rtToday() });
      const [accountId, setAccountId] = useState((accounts[0] || {}).id || '');
      const [saveName, setSaveName] = useState('');
      const fileRef = useRef(null);
      const setM = (k, v) => setMap(p => ({ ...p, [k]: v }));

      const rows = (sheets[sheetIdx] || {}).rows || [];
      const nCols = Math.min(40, Math.max(0, ...rows.slice(0, 40).map(r => r.length)));
      const colOptions = [];
      for (let i = 0; i < nCols; i++) {
        const sample = (rows.find(r => r[i] !== '' && r[i] != null) || [])[i];
        colOptions.push({ i, label: `${rtColName(i)}${sample != null ? ` — ${String(sample).slice(0, 20)}` : ''}` });
      }

      async function handleFile(f) {
        if (!f) return;
        setBusy(true); setErr(null);
        try {
          const XLSX = await rtLoadXlsx();
          // CSV: keep raw strings so day-first dates (01/02/2025 = 1 בפברואר) aren't
          // misread as US month-first. Real xlsx files store dates unambiguously.
          const isCsv = /\.csv$/i.test(f.name) || f.type === 'text/csv';
          const wb = isCsv
            ? XLSX.read(await f.text(), { type: 'string', raw: true })
            : XLSX.read(await f.arrayBuffer(), { cellDates: true });
          const parsed = wb.SheetNames.map(name => ({
            name,
            rows: XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' }),
          })).filter(s => s.rows.length > 0);
          if (!parsed.length) throw new Error('empty');
          setSheets(parsed); setSheetIdx(0);
          setFileName(f.name);
          setStep('map');
        } catch (e) {
          console.error(e);
          setErr('קריאת הקובץ נכשלה — ודא שזה קובץ Excel או CSV תקין');
        }
        setBusy(false);
      }

      // Rows that don't parse (headers, totals, blanks) are skipped automatically
      function buildRecords() {
        if (map.type === 'sum') {
          let sum = 0, count = 0;
          rows.forEach(r => {
            const n = rtParseNumCell(r[map.amountCol]);
            if (n != null) { sum += n; count++; }
          });
          return { records: count ? [{ accountId, date: map.date, value: Math.round(sum * 100) / 100 }] : [],
                   skipped: rows.length - count, sumCount: count };
        }
        const out = { records: [], skipped: 0 };
        rows.forEach(r => {
          const d = rtParseDateCell(r[map.dateCol]);
          const n = rtParseNumCell(r[map.amountCol]);
          if (!d || n == null) { out.skipped++; return; }
          if (map.type === 'values') {
            out.records.push({ accountId, date: d, value: Math.abs(n) });
          } else {
            let kind = map.kindMode === 'withdraw' ? 'withdraw' : 'deposit';
            let amount = n;
            if (map.kindMode === 'sign') { kind = n < 0 ? 'withdraw' : 'deposit'; amount = Math.abs(n); }
            if (!(amount > 0)) { out.skipped++; return; }
            out.records.push({ accountId, date: d, amount, kind });
          }
        });
        return out;
      }

      const built = step === 'map' && accountId ? buildRecords() : null;
      let dupCount = 0;
      if (built && map.type === 'flows') {
        const exists = new Set(rt.flows.map(f => `${f.accountId}|${f.date}|${f.amount}|${f.kind}`));
        dupCount = built.records.filter(r => exists.has(`${r.accountId}|${r.date}|${r.amount}|${r.kind}`)).length;
      }

      const doImport = () => {
        if (!accountId) return alert('בחר חשבון');
        if (!built || !built.records.length) return alert('לא זוהו רשומות תקינות');
        const newCount = built.records.length - dupCount;
        const label = map.type === 'sum'
          ? `לרשום שווי ${rtFmt(built.records[0].value)} לתאריך ${rtFmtDate(map.date)} (סכום של ${built.sumCount} שורות)?`
          : map.type === 'values'
            ? `לייבא ${built.records.length} רשומות שווי? (רשומה קיימת לאותו תאריך תוחלף)`
            : `לייבא ${newCount} תנועות חדשות?${dupCount ? ` (${dupCount} כפולות ידולגו)` : ''}`;
        if (!confirm(label)) return;
        onImportRecords({ type: map.type === 'flows' ? 'flows' : 'values', records: built.records });
        if (saveName.trim()) {
          onSaveMap({ name: saveName.trim(), type: map.type, dateCol: map.dateCol,
                      amountCol: map.amountCol, kindMode: map.kindMode, accountId });
        }
      };

      const applyProfile = p => {
        setMap(m => ({ ...m, type: p.type, dateCol: p.dateCol, amountCol: p.amountCol,
                       kindMode: p.kindMode || 'sign' }));
        if (rt.accounts.some(a => a.id === p.accountId)) setAccountId(p.accountId);
      };

      return (
        <RtSheet title="ייבוא מקובץ Excel / CSV" onClose={onClose}>
          {step === 'file' && (
            <>
              <div style={{ fontSize: 12, color: 'var(--ink-3)', marginBottom: 14, lineHeight: 1.6 }}>
                הקובץ נקרא במכשיר בלבד — שום נתון לא נשלח לשום מקום.
                מתאים לייצוא תנועות מהבנק/ברוקר, היסטוריית שוויים, או תיק מניות (סכימת פוזיציות לשווי אחד).
              </div>
              <div className={`rt-drop`} onClick={() => fileRef.current && fileRef.current.click()}
                onDragOver={e => e.preventDefault()}
                onDrop={e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}>
                {busy ? 'קורא…' : 'גרור לכאן קובץ xlsx / csv, או לחץ לבחירה'}
              </div>
              <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" hidden
                onChange={e => { handleFile(e.target.files[0]); e.target.value = ''; }} />
              {err && <div style={{ fontSize: 12, color: '#B91C1C', marginTop: 10 }}>{err}</div>}
            </>
          )}

          {step === 'map' && (
            <>
              <div style={{ fontSize: 12, color: 'var(--ink-3)', marginBottom: 10 }} className="rt-num">{fileName}</div>

              {(rt.importMaps || []).length > 0 && (
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12, alignItems: 'center' }}>
                  <span style={{ fontSize: 11, color: 'var(--ink-3)' }}>מיפוי שמור:</span>
                  {rt.importMaps.map(p => (
                    <button key={p.id} className="rt-chip" onClick={() => applyProfile(p)}>{p.name}</button>
                  ))}
                </div>
              )}

              {/* Raw preview */}
              <div style={{ overflow: 'auto', border: '1px solid var(--border)', borderRadius: 10, marginBottom: 14 }}>
                <table style={{ borderCollapse: 'collapse', fontSize: 11, direction: 'ltr' }}>
                  <thead>
                    <tr>{colOptions.slice(0, 10).map(c => (
                      <th key={c.i} style={{ padding: '3px 8px', background: 'var(--surface-2)',
                        borderBottom: '1px solid var(--border)', fontWeight: 700, color: 'var(--ink-3)',
                        textAlign: 'left' }}>{rtColName(c.i)}</th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {rows.slice(0, 6).map((r, ri) => (
                      <tr key={ri}>{colOptions.slice(0, 10).map(c => (
                        <td key={c.i} style={{ padding: '3px 8px', borderBottom: '1px solid var(--border-2)',
                          whiteSpace: 'nowrap', maxWidth: 140, overflow: 'hidden', textOverflow: 'ellipsis' }}>
                          {r[c.i] instanceof Date ? rtParseDateCell(r[c.i]) : String(r[c.i] ?? '')}
                        </td>
                      ))}</tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <RtFormRow>
                {sheets.length > 1 && (
                  <div className="rt-field">
                    <label className="rt-label">גיליון</label>
                    <select className="rt-select" value={sheetIdx} onChange={e => setSheetIdx(+e.target.value)}>
                      {sheets.map((s, i) => <option key={i} value={i}>{s.name}</option>)}
                    </select>
                  </div>
                )}
                <div className="rt-field">
                  <label className="rt-label">מה מייבאים?</label>
                  <select className="rt-select" value={map.type} onChange={e => setM('type', e.target.value)}>
                    <option value="flows">תנועות (הפקדות/משיכות)</option>
                    <option value="values">שוויים (שורה לכל תאריך)</option>
                    <option value="sum">שווי אחד — סכום כל השורות</option>
                  </select>
                </div>
                <div className="rt-field">
                  <label className="rt-label">לאיזה חשבון</label>
                  <RtAccountSelect accounts={accounts} value={accountId} onChange={setAccountId} />
                </div>
              </RtFormRow>

              <RtFormRow>
                {map.type !== 'sum' && (
                  <div className="rt-field">
                    <label className="rt-label">עמודת תאריך</label>
                    <select className="rt-select" value={map.dateCol} onChange={e => setM('dateCol', +e.target.value)}>
                      {colOptions.map(c => <option key={c.i} value={c.i}>{c.label}</option>)}
                    </select>
                  </div>
                )}
                <div className="rt-field">
                  <label className="rt-label">{map.type === 'flows' ? 'עמודת סכום' : 'עמודת שווי'}</label>
                  <select className="rt-select" value={map.amountCol} onChange={e => setM('amountCol', +e.target.value)}>
                    {colOptions.map(c => <option key={c.i} value={c.i}>{c.label}</option>)}
                  </select>
                </div>
                {map.type === 'flows' && (
                  <div className="rt-field">
                    <label className="rt-label">איך לזהות הפקדה/משיכה</label>
                    <select className="rt-select" value={map.kindMode} onChange={e => setM('kindMode', e.target.value)}>
                      <option value="sign">לפי סימן: חיובי=הפקדה, שלילי=משיכה</option>
                      <option value="deposit">הכל הפקדות</option>
                      <option value="withdraw">הכל משיכות</option>
                    </select>
                  </div>
                )}
                {map.type === 'sum' && (
                  <div className="rt-field">
                    <label className="rt-label">תאריך השווי</label>
                    <input className="rt-input" type="date" value={map.date} onChange={e => setM('date', e.target.value)} />
                  </div>
                )}
              </RtFormRow>

              {/* Live parse summary */}
              {built && (
                <div style={{ background: 'var(--surface-2)', border: '1px solid var(--border)',
                              borderRadius: 10, padding: '10px 14px', fontSize: 12, color: 'var(--ink-2)',
                              marginBottom: 12, lineHeight: 1.7 }}>
                  {map.type === 'sum' ? (
                    <>זוהו <b className="rt-num">{built.sumCount}</b> שורות עם מספר · סה"כ:{' '}
                      <b className="rt-num">{rtFmt(built.records[0]?.value)}</b> בתאריך {rtFmtDate(map.date)}</>
                  ) : (
                    <>זוהו <b className="rt-num">{built.records.length}</b> רשומות תקינות
                      {built.skipped > 0 && <> · {built.skipped} שורות דולגו (כותרות/ריקות/לא תקינות)</>}
                      {dupCount > 0 && <> · <b>{dupCount}</b> כבר קיימות — ידולגו</>}
                      {built.records.length > 0 && (
                        <div style={{ marginTop: 4, color: 'var(--ink-3)' }}>
                          דוגמה: {built.records.slice(0, 3).map(r =>
                            `${rtFmtDate(r.date)} — ${rtFmt(r.amount ?? r.value)}${r.kind ? (r.kind === 'deposit' ? ' הפקדה' : ' משיכה') : ''}`
                          ).join(' · ')}
                        </div>
                      )}
                    </>
                  )}
                </div>
              )}

              <RtFormRow>
                <div className="rt-field">
                  <label className="rt-label">שמור מיפוי לפעם הבאה (לא חובה)</label>
                  <input className="rt-input" placeholder='למשל: "תנועות קולמקס"' value={saveName}
                    onChange={e => setSaveName(e.target.value)} />
                </div>
              </RtFormRow>

              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}>
                <button className="rt-btn" onClick={doImport}
                  disabled={!built || !built.records.length}
                  style={{ opacity: built && built.records.length ? 1 : 0.5 }}>
                  ייבוא
                </button>
                <button className="rt-btn2" onClick={() => { setStep('file'); setErr(null); }}>קובץ אחר</button>
              </div>
            </>
          )}
        </RtSheet>
      );
    }

    // Open a stored report via a short-lived signed URL (private bucket — no public links)
    async function rtOpenDocument(doc) {
      try {
        const sb = await rtSupabase();
        if (!sb) return alert('הארכיון לא מוגדר — פתח את לשונית הארכיון להגדרה');
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return alert('צריך להתחבר קודם, בלשונית הארכיון');
        const { data, error } = await sb.storage.from(RT_BUCKET).createSignedUrl(doc.path, 60);
        if (error || !data?.signedUrl) throw error || new Error('no url');
        window.open(data.signedUrl, '_blank');
      } catch (e) {
        console.error(e);
        alert('פתיחת המסמך נכשלה');
      }
    }

    // ── AI extraction of a stored report ─────────────────
    // The document goes to a Supabase Edge Function (extract-report) that
    // holds the Anthropic API key server-side. The browser never sees the
    // key; the call is gated by the same Supabase Auth as the archive.
    // Nothing is saved without explicit user review + approval.
    async function rtFileToB64(blob) {
      const buf = new Uint8Array(await blob.arrayBuffer());
      let s = '';
      for (let i = 0; i < buf.length; i += 0x8000) {
        s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      }
      return btoa(s);
    }
    async function rtExtractDocument(doc) {
      const cfg = rtSbCfg();
      const sb = await rtSupabase();
      if (!cfg || !sb) throw new Error('הארכיון לא מוגדר');
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error('צריך להתחבר קודם');
      const { data: urlData, error } = await sb.storage.from(RT_BUCKET).createSignedUrl(doc.path, 120);
      if (error || !urlData?.signedUrl) throw new Error('הורדת הקובץ נכשלה');
      const blob = await (await fetch(urlData.signedUrl)).blob();
      if (blob.size > 15 * 1024 * 1024) throw new Error('הקובץ גדול מדי (מעל 15MB)');
      const ext = (doc.path.split('.').pop() || '').toLowerCase();
      const media = ext === 'pdf' ? 'application/pdf'
        : ext === 'png' ? 'image/png'
        : ext === 'webp' ? 'image/webp' : 'image/jpeg';
      const r = await fetch(`${cfg.url}/functions/v1/extract-report`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`,
          apikey: cfg.anonKey,
        },
        body: JSON.stringify({ media_type: media, data_b64: await rtFileToB64(blob), filename: doc.name }),
      });
      const j = await r.json().catch(() => null);
      if (r.status === 404) throw new Error('פונקציית extract-report לא קיימת — ראה הוראות בקובץ הקמת-Supabase.md');
      if (!r.ok || !j || j.error) throw new Error(j?.error || `שגיאה (${r.status})`);
      return j;
    }

    // ── Review screen: nothing enters the books without approval ──
    function RtExtractReview({ data, doc, accounts, onApply, onClose }) {
      const guessAcc = () => {
        const g = (data.account_name_guess || '').trim();
        const byName = g && accounts.find(a =>
          a.name.includes(g) || g.includes(a.name));
        return (byName || accounts.find(a => a.id === doc.accountId) || accounts[0] || {}).id || '';
      };
      const [accountId, setAccountId] = useState(guessAcc);
      const validDate = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
      const values = (Array.isArray(data.values) ? data.values : [])
        .filter(v => validDate(v.date) && typeof v.value === 'number' && isFinite(v.value));
      const flows = (Array.isArray(data.flows) ? data.flows : [])
        .filter(f => validDate(f.date) && typeof f.amount === 'number' && f.amount > 0
                  && (f.kind === 'deposit' || f.kind === 'withdraw'));
      const year = Number.isInteger(data.year) ? data.year : null;
      const hasIncome = year && ((data.dividends || 0) !== 0 || (data.fees || 0) !== 0);
      const [checks, setChecks] = useState(() => ({
        values: values.map(() => true),
        flows: flows.map(() => true),
        income: hasIncome,
      }));
      const toggle = (k, i) => setChecks(c => k === 'income'
        ? { ...c, income: !c.income }
        : { ...c, [k]: c[k].map((v, j) => j === i ? !v : v) });
      const acc = accounts.find(a => a.id === accountId);
      const curMismatch = acc && data.currency && acc.currency !== data.currency;
      const nPicked = checks.values.filter(Boolean).length + checks.flows.filter(Boolean).length
        + (checks.income ? 1 : 0);
      return (
        <RtSheet title="בדיקת חילוץ — אשר לפני שמירה" onClose={onClose}>
          <div style={{ fontSize: 12, color: 'var(--ink-3)', marginBottom: 12, lineHeight: 1.6 }}>
            📄 {doc.name} · ה־AI קרא את הדוח — עבור על המספרים מול המסמך ואשר. כלום לא נשמר בלי האישור שלך.
          </div>
          <RtFormRow>
            <div className="rt-field" style={{ flexBasis: '100%' }}>
              <label className="rt-label">
                לאיזה חשבון{data.account_name_guess ? ` (זוהה: "${data.account_name_guess}")` : ''}
              </label>
              <RtAccountSelect accounts={accounts} value={accountId} onChange={setAccountId} />
            </div>
          </RtFormRow>
          {curMismatch && (
            <div className="rt-warn" style={{ marginBottom: 10 }}>
              ⚠ הדוח נראה ב־{data.currency} אבל החשבון ב־{acc.currency} — ודא שזה החשבון הנכון
            </div>
          )}

          {values.length > 0 && <div className="rt-label" style={{ marginTop: 8 }}>שוויים</div>}
          {values.map((v, i) => (
            <label key={`v${i}`} className="rt-row" style={{ cursor: 'pointer' }}>
              <span style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 13 }}>
                <input type="checkbox" checked={checks.values[i]} onChange={() => toggle('values', i)} />
                <span className="rt-num">{rtFmtDate(v.date)}</span>
                {v.label && <span style={{ fontSize: 11, color: 'var(--ink-3)' }}>{v.label}</span>}
              </span>
              <RtMoney v={v.value} cur={data.currency || acc?.currency} size={13} />
            </label>
          ))}

          {flows.length > 0 && <div className="rt-label" style={{ marginTop: 8 }}>תנועות</div>}
          {flows.map((f, i) => (
            <label key={`f${i}`} className="rt-row" style={{ cursor: 'pointer' }}>
              <span style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 13 }}>
                <input type="checkbox" checked={checks.flows[i]} onChange={() => toggle('flows', i)} />
                <span className="rt-num">{rtFmtDate(f.date)}</span>

    // ── Missing-data tab: exactly what to fill to get a number ──
    function RtMissingTab({ result, rt }) {
      const issues = [];
      result.rows.forEach(r => {
        r.missing.forEach(m => issues.push({ acc: r.account.name, text: m, hard: true }));
        r.warnings.forEach(w => issues.push({ acc: r.account.name, text: w, hard: false }));
      });
      const usdAccounts = rt.accounts.filter(a => a.active !== false && a.currency === 'USD');
      if (usdAccounts.length && rt.fx.length < 2) {
        issues.unshift({ acc: 'שערי דולר', hard: true,
          text: `יש ${usdAccounts.length} חשבונות דולריים אבל רק ${rt.fx.length} נקודות שער — צריך לפחות שער לתחילת התקופה ולסופה` });
      }
      return (
        <section className="panel-card anim-1" style={{ padding: '18px 24px 20px' }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase',
                        color: 'var(--ink-3)', marginBottom: 12 }}>
            חסרים · {result.period.label}
          </div>
          {issues.length === 0 ? (
            <div style={{ padding: '18px 0', textAlign: 'center' }}>
              <div style={{ fontSize: 26, marginBottom: 8 }}>✓</div>
              <div style={{ fontSize: 14, fontWeight: 600, color: '#047857' }}>הכל מלא — כל החשבונות נכללים בחישוב</div>
            </div>
          ) : issues.map((it, i) => (
            <div key={i} className="rt-row">
              <span style={{ fontSize: 13 }}>
                <span style={{ fontWeight: 600 }}>{it.acc}</span>
                <span style={{ color: 'var(--ink-2)', marginInlineStart: 8 }}>{it.text}</span>
              </span>
              <span style={{ fontSize: 11, fontWeight: 700, color: it.hard ? '#B91C1C' : '#92400E' }}>
                {it.hard ? 'חוסם' : 'אזהרה'}
              </span>
            </div>
          ))}
          <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 12, lineHeight: 1.6 }}>
            "חוסם" — החשבון לא נכלל בסך התיק עד שהנתון יושלם. "אזהרה" — המספר מוצג, אבל כדאי לדייק אותו.
          </div>
        </section>
      );

    // ── Report archive (Supabase Storage, private bucket + RLS) ──
    // Files live only in Supabase; metadata lives in returns.documents and
    // syncs normally. If Supabase is missing/unavailable — everything else
    // keeps working, the archive simply isn't shown.
    function RtArchiveTab({ rt, update }) {
      const [cfg, setCfgState] = useState(() => rtSbCfg());
      const [session, setSession] = useState(null);
      const [checking, setChecking] = useState(!!rtSbCfg());
      const [err, setErr] = useState(null);
      const [busy, setBusy] = useState(false);
      const [form, setForm] = useState({ url: '', anonKey: '', email: '', password: '' });
      const [upAcc, setUpAcc] = useState('');
      const [upYear, setUpYear] = useState(String(new Date().getFullYear()));
      const [drag, setDrag] = useState(false);
      const [extract, setExtract] = useState(null);      // { doc, data } → review sheet
      const [extracting, setExtracting] = useState(null); // doc.id while running
      const fileRef = useRef(null);
      const setF = (k, v) => setForm(p => ({ ...p, [k]: v }));

      useEffect(() => {
        let alive = true;
        (async () => {
          if (!cfg) { setChecking(false); return; }
          try {
            const sb = await rtSupabase();
            if (sb && alive) {
              const { data } = await sb.auth.getSession();
              setSession(data.session || null);
            }
          } catch { if (alive) setErr('החיבור ל־Supabase נכשל — בדוק כתובת ומפתח'); }
          if (alive) setChecking(false);
        })();
        return () => { alive = false; };
      }, [cfg]);

      const saveCfg = () => {
        if (!form.url.trim() || !form.anonKey.trim()) return alert('חסרים Project URL או anon key');
        rtSbSaveCfg({ url: form.url.trim().replace(/\/+$/, ''), anonKey: form.anonKey.trim() });
        _rtSbClient = null;
        setErr(null); setChecking(true);
        setCfgState(rtSbCfg());
      };
      const disconnect = () => {
        if (!confirm('לנתק את הגדרות הארכיון מהמכשיר הזה? (הקבצים נשארים ב־Supabase)')) return;
        rtSbSaveCfg(null); _rtSbClient = null;
        setCfgState(null); setSession(null);
      };
      const login = async () => {
        setBusy(true); setErr(null);
        try {
          const sb = await rtSupabase();
          const { data, error } = await sb.auth.signInWithPassword({
            email: form.email.trim(), password: form.password });
          if (error) throw error;
          setSession(data.session);
        } catch (e) { setErr('התחברות נכשלה — בדוק אימייל וסיסמה'); }
        setBusy(false);
      };
      const logout = async () => {
        try { const sb = await rtSupabase(); await sb.auth.signOut(); } catch {}
        setSession(null);
      };

      const uploadFiles = async (fileList) => {
        const files = [...fileList].filter(f =>
          f.type === 'application/pdf' || f.type.startsWith('image/'));
        if (!files.length) return alert('רק PDF או תמונות');
        setBusy(true); setErr(null);
        try {
          const sb = await rtSupabase();
          for (const file of files) {
            const id = nextRid();
            const ext = (file.name.split('.').pop() || 'pdf').toLowerCase().replace(/[^a-z0-9]/g, '');
            // Storage keys are ASCII-safe; the original (Hebrew) name lives in metadata
            const path = `${session.user.id}/${id}.${ext}`;
            const { error } = await sb.storage.from(RT_BUCKET).upload(path, file);
            if (error) throw error;
            update(s => ({ ...s, documents: [...s.documents, {
              id, name: file.name, accountId: upAcc || null,
              year: parseInt(upYear) || null, path, uploadedAt: rtToday(),
            }]}));
          }
        } catch (e) {
          console.error(e);
          setErr('העלאה נכשלה — ודא שה־bucket "reports" קיים ושמדיניות ה־RLS הוגדרה');
        }
        setBusy(false);
      };

      const deleteDoc = async (doc) => {
        if (!confirm(`למחוק את "${doc.name}" לצמיתות?`)) return;
        setBusy(true);
        try {
          const sb = await rtSupabase();
          await sb.storage.from(RT_BUCKET).remove([doc.path]);
        } catch {}
        update(s => ({ ...s, documents: s.documents.filter(d => d.id !== doc.id) }));
        setBusy(false);
      };

      const runExtract = async (doc) => {
        setExtracting(doc.id); setErr(null);
        try {
          const data = await rtExtractDocument(doc);
          setExtract({ doc, data });
        } catch (e) {
          setErr(`חילוץ נכשל: ${e.message || e}`);
        }
        setExtracting(null);
      };

      // Approved records enter the books linked to their source document
      const applyExtract = ({ accountId, docId, values, flows, income }) => {
        update(s => {
          let newValues = [...s.values];
          values.forEach(v => {
            newValues = newValues.filter(x => !(x.accountId === accountId && x.date === v.date));
            newValues.push({ id: nextRid(), accountId, date: v.date, value: v.value, docId });
          });
          const exists = new Set(s.flows.map(f => `${f.accountId}|${f.date}|${f.amount}|${f.kind}`));
          const newFlows = [...s.flows, ...flows
            .filter(f => !exists.has(`${accountId}|${f.date}|${f.amount}|${f.kind}`))
            .map(f => ({ id: nextRid(), accountId, date: f.date, amount: f.amount, kind: f.kind, docId }))];
          let newIncome = [...s.income];
          if (income) {
            newIncome = newIncome.filter(i => !(i.accountId === accountId && i.year === income.year));
            newIncome.push({ id: nextRid(), accountId, year: income.year,
                             dividends: income.dividends, fees: income.fees });
          }
          // remember the account on the document itself for next time
          const documents = s.documents.map(d => d.id === docId && !d.accountId ? { ...d, accountId } : d);
          return { ...s, values: newValues, flows: newFlows, income: newIncome, documents };
        });
        setExtract(null);
      };

      const accName = id => (rt.accounts.find(a => a.id === id) || {}).name || '—';
      const docs = [...rt.documents].sort((a, b) => (b.uploadedAt || '').localeCompare(a.uploadedAt || ''));

      // ── Not configured yet: setup form ──
      if (!cfg) {
        return (
          <section className="panel-card anim-1" style={{ padding: '20px 24px 22px' }}>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase',
                          color: 'var(--ink-3)', marginBottom: 8 }}>ארכיון דוחות — הגדרה</div>
            <div style={{ fontSize: 13, color: 'var(--ink-2)', lineHeight: 1.7, marginBottom: 16 }}>
              הארכיון שומר PDF של דוחות ב־Supabase (bucket פרטי, מאחורי התחברות).
              ההוראות המלאות בקובץ <b>הקמת-Supabase.md</b>. עד שממלאים — הפיצ'ר פשוט לא פעיל, ושום דבר אחר לא מושפע.
            </div>
            <RtFormRow>
              <div className="rt-field" style={{ flexBasis: '100%' }}>
                <label className="rt-label">Project URL</label>
                <input className="rt-input num" dir="ltr" placeholder="https://xxxx.supabase.co"
                  value={form.url} onChange={e => setF('url', e.target.value)} />
              </div>
            </RtFormRow>
            <RtFormRow>
              <div className="rt-field" style={{ flexBasis: '100%' }}>
                <label className="rt-label">anon key (public)</label>
                <input className="rt-input num" dir="ltr" placeholder="eyJhbGciOi..."
                  value={form.anonKey} onChange={e => setF('anonKey', e.target.value)} />
              </div>
            </RtFormRow>
            <button className="rt-btn" onClick={saveCfg}>שמור והמשך להתחברות</button>
          </section>
        );
      }

      // ── Configured but not signed in ──
      if (!session) {
        return (
          <section className="panel-card anim-1" style={{ padding: '20px 24px 22px' }}>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase',
                          color: 'var(--ink-3)', marginBottom: 12 }}>ארכיון דוחות — התחברות</div>
            {checking ? <div style={{ fontSize: 13, color: 'var(--ink-3)' }}>בודק חיבור…</div> : (
              <>
                <RtFormRow>
                  <div className="rt-field">
                    <label className="rt-label">אימייל</label>
                    <input className="rt-input num" dir="ltr" type="email" value={form.email}
                      onChange={e => setF('email', e.target.value)} />
                  </div>
                  <div className="rt-field">
                    <label className="rt-label">סיסמה</label>
                    <input className="rt-input num" dir="ltr" type="password" value={form.password}
                      onChange={e => setF('password', e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && login()} />
                  </div>
                </RtFormRow>
                {err && <div style={{ fontSize: 12, color: '#B91C1C', marginBottom: 10 }}>{err}</div>}
                <div style={{ display: 'flex', gap: 8 }}>
                  <button className="rt-btn" onClick={login} disabled={busy}>{busy ? 'מתחבר…' : 'התחברות'}</button>
                  <button className="rt-btn2" onClick={disconnect}>ניתוק הגדרות</button>
                </div>
                <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 12 }}>
                  ההתחברות נשמרת במכשיר — לא תראה את המסך הזה שוב.
                </div>
              </>
            )}
          </section>
        );
      }

      // ── Signed in: upload + list ──
      return (
        <>
          <section className="panel-card anim-1" style={{ padding: '20px 24px 22px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
              <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase',
                             color: 'var(--ink-3)' }}>העלאת דוח</span>
              <span style={{ fontSize: 11, color: 'var(--ink-3)', direction: 'ltr' }}>{session.user.email}</span>
            </div>
            <RtFormRow>
              <div className="rt-field">
                <label className="rt-label">שיוך לחשבון</label>
                <RtAccountSelect accounts={rt.accounts} value={upAcc} onChange={setUpAcc} allowEmpty />
              </div>
              <div className="rt-field" style={{ maxWidth: 110 }}>
                <label className="rt-label">שנה</label>
                <input className="rt-input num" inputMode="numeric" value={upYear}
                  onChange={e => setUpYear(e.target.value)} />
              </div>
            </RtFormRow>
            <div className={`rt-drop${drag ? ' over' : ''}`}
              onClick={() => fileRef.current && fileRef.current.click()}
              onDragOver={e => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={e => { e.preventDefault(); setDrag(false); uploadFiles(e.dataTransfer.files); }}>
              {busy ? 'מעלה…' : 'גרור לכאן PDF או תמונה, או לחץ לבחירה'}
            </div>
            <input ref={fileRef} type="file" accept="application/pdf,image/*" multiple hidden
              onChange={e => { uploadFiles(e.target.files); e.target.value = ''; }} />
            {err && <div style={{ fontSize: 12, color: '#B91C1C', marginTop: 10 }}>{err}</div>}
            <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
              <button className="rt-btn2" onClick={logout}>התנתקות</button>
              <button className="rt-btn2" onClick={disconnect}>ניתוק הגדרות</button>
            </div>
          </section>

          <section className="panel-card anim-2" style={{ padding: '18px 24px 16px', marginTop: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase',
                          color: 'var(--ink-3)', marginBottom: 8 }}>מסמכים · {docs.length}</div>
            {docs.length === 0 && <div style={{ fontSize: 13, color: 'var(--ink-3)', padding: '6px 0 12px' }}>
              אין מסמכים עדיין. בעוד חמש שנים תודה לעצמך שהעלית.
            </div>}
            {docs.map(d => (
              <div key={d.id} className="rt-row">
                <span style={{ fontSize: 13, cursor: 'pointer', color: 'var(--accent)', fontWeight: 500, minWidth: 0,
                               overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}
                  onClick={() => rtOpenDocument(d)}>📄 {d.name}</span>
                <span style={{ display: 'flex', gap: 10, alignItems: 'center', flexShrink: 0 }}>
                  <span style={{ fontSize: 11, color: 'var(--ink-3)' }}>
                    {accName(d.accountId)}{d.year ? ` · ${d.year}` : ''}
                  </span>
                  <button className="rt-mini-btn" onClick={() => runExtract(d)}
                    disabled={extracting != null}
                    title="חילוץ נתונים עם AI"
                    style={{ width: 'auto', padding: '0 8px', fontSize: 11,
                             color: extracting === d.id ? 'var(--ink-3)' : 'var(--accent)' }}>
                    {extracting === d.id ? 'מחלץ…' : '✨ חילוץ'}
                  </button>
                  <button className="rt-mini-btn" onClick={() => deleteDoc(d)} title="מחיקה">×</button>
                </span>
              </div>
            ))}
            {docs.length > 0 && (
              <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 10, lineHeight: 1.6 }}>
                ✨ חילוץ — ה־AI קורא את הדוח ומציע שוויים, תנועות ודמי ניהול. שום דבר לא נשמר בלי אישור שלך.
              </div>
            )}
          </section>

          {extract && (
            <RtExtractReview data={extract.data} doc={extract.doc}
              accounts={rt.accounts.filter(a => a.active !== false)}
              onApply={applyExtract} onClose={() => setExtract(null)} />
          )}
        </>
      );
    }

    // ═════════════════════════════════════════════════════
    // ReturnsApp — the returns screen root
    // ═════════════════════════════════════════════════════
    function ReturnsApp({ syncConfig, onHome }) {
      const [rt, setRt] = useState(() => rtLoad());
      const [tab, setTab] = useState('main'); // main|accounts|entry|missing|archive
      const [periodId, setPeriodId] = useState(String(new Date().getFullYear()));
      const [filter, setFilter] = useState({ group: null, owner: null, account: null });
      const [rtSync, setRtSync] = useState('idle');
      const [sheet, setSheet] = useState(null);     // { type, data }
      const [detailAcc, setDetailAcc] = useState(null);
      const dirty = useRef(false);
      const pushTimer = useRef(null);

      // Every mutation goes through here: stamp, keep shape, mark for push
      const update = useCallback(fn => {
        dirty.current = true;
        setRt(prev => ({ ...rtNormalize(fn(prev)), updatedAt: new Date().toISOString() }));
      }, []);

      // Save locally always; push (debounced) only after real mutations
      useEffect(() => {
        if (!dirty.current) return;
        rtSaveLocal(rt);
        if (!syncConfig) return;
        clearTimeout(pushTimer.current);
        setRtSync('saving');
        pushTimer.current = setTimeout(() => {
          pushReturnsToBin(syncConfig, rt)
            .then(() => setRtSync('ok'))
            .catch(() => setRtSync('error'));
        }, 1200);
        return () => clearTimeout(pushTimer.current);
      }, [rt, syncConfig]);

      // Pull on mount — newer side wins (updatedAt)
      useEffect(() => {
        if (!syncConfig) return;
        setRtSync('loading');
        fetchFromJsonBin(syncConfig)
          .then(data => {
            const remote = data && data.returns ? rtNormalize(data.returns) : null;
            const local = rtLoad();
            if (remote && (remote.updatedAt || '') > (local.updatedAt || '')) {
              setRt(remote);
              rtSaveLocal(remote);
            } else if (local.updatedAt && (!remote || (remote.updatedAt || '') < local.updatedAt)) {
              pushReturnsToBin(syncConfig, local).catch(() => {});
            }
            setRtSync('ok');
          })
          .catch(() => setRtSync('error'));
      }, []);

      const result = useMemo(() => rtComputePortfolio(rt, filter, periodId), [rt, filter, periodId]);

      const years = useMemo(() => {
        const ys = new Set([
          ...rt.values.map(v => v.date.slice(0, 4)),
          ...rt.flows.map(f => f.date.slice(0, 4)),
        ]);
        ys.add(String(new Date().getFullYear()));
        return [...ys].sort((a, b) => b.localeCompare(a));
      }, [rt]);

      const owners = useMemo(() =>
        [...new Set(rt.accounts.map(a => a.owner).filter(Boolean))], [rt.accounts]);
      const activeAccounts = rt.accounts.filter(a => a.active !== false);

      // ── Record mutations ──
      const saveAccount = a => {
        if (a.id) update(s => ({ ...s, accounts: s.accounts.map(x => x.id === a.id ? { ...x, ...a } : x) }));
        else update(s => ({ ...s, accounts: [...s.accounts, { ...a, id: nextRid() }] }));
        setSheet(null);
      };
      const deleteAccount = id => {
        const acc = rt.accounts.find(a => a.id === id);
        if (!acc) return;
        const nVals = rt.values.filter(v => v.accountId === id).length;
        const nFlows = rt.flows.filter(f => f.accountId === id).length;
        if (!confirm(`למחוק את "${acc.name}" יחד עם ${nVals} שוויים ו־${nFlows} תנועות?`)) return;
        update(s => ({ ...s,
          accounts: s.accounts.filter(a => a.id !== id),
          values: s.values.filter(v => v.accountId !== id),
          flows: s.flows.filter(f => f.accountId !== id),
          income: s.income.filter(i => i.accountId !== id),
          documents: s.documents.map(d => d.accountId === id ? { ...d, accountId: null } : d),
        }));
        setSheet(null); setDetailAcc(null);
      };
      const saveRec = (key, rec) => {
        if (rec.id) update(s => ({ ...s, [key]: s[key].map(x => x.id === rec.id ? { ...x, ...rec } : x) }));
        else update(s => ({ ...s, [key]: [...s[key], { ...rec, id: nextRid() }] }));
        setSheet(null);
      };
      const deleteRec = (key, id) => {
        if (!confirm('למחוק את הרשומה?')) return;
        update(s => ({ ...s, [key]: s[key].filter(x => x.id !== id) }));
        setSheet(null);
      };
      const addFx = p => update(s => ({ ...s, fx: [...s.fx.filter(x => x.date !== p.date), p] }));
      const deleteFx = date => {
        if (!confirm(`למחוק את השער מ־${rtFmtDate(date)}?`)) return;
        update(s => ({ ...s, fx: s.fx.filter(x => x.date !== date) }));
      };
      const createRecurring = flows => {
        update(s => ({ ...s, flows: [...s.flows, ...flows.map(f => ({ ...f, id: nextRid() }))] }));
        setSheet(null);
      };
      const importAccounts = rows => {
        const today = rtToday();
        update(s => {
          const accounts = [...s.accounts];
          let values = [...s.values];
          rows.forEach(r => {
            if (r.mode === 'update' && r.existingId) {
              // Refresh today's value on an existing account (replace if already entered today)
              values = values.filter(v => !(v.accountId === r.existingId && v.date === today));
              values.push({ id: nextRid(), accountId: r.existingId, date: today, value: r.value });
            } else {
              const id = nextRid();
              accounts.push({ id, name: r.name, group: r.group, currency: r.currency,
                              owner: r.owner || '', active: true });
              if (r.value > 0) values.push({ id: nextRid(), accountId: id, date: today, value: r.value });
            }
          });
          return { ...s, accounts, values };
        });
        setSheet(null);
        setTab('accounts');
      };

      // Excel/CSV import: flows deduped exactly, values replace same account+date
      const importRecords = ({ type, records }) => {
        update(s => {
          if (type === 'flows') {
            const exists = new Set(s.flows.map(f => `${f.accountId}|${f.date}|${f.amount}|${f.kind}`));
            const add = records
              .filter(r => !exists.has(`${r.accountId}|${r.date}|${r.amount}|${r.kind}`))
              .map(r => ({ ...r, id: nextRid() }));
            return { ...s, flows: [...s.flows, ...add] };
          }
          let values = [...s.values];
          records.forEach(r => {
            values = values.filter(v => !(v.accountId === r.accountId && v.date === r.date));
            values.push({ ...r, id: nextRid() });
          });
          return { ...s, values };
        });
        setSheet(null);
      };
      const saveImportMap = m => update(s => ({
        ...s,
        importMaps: [...(s.importMaps || []).filter(x => x.name !== m.name), { ...m, id: nextRid() }],
      }));

      // ── Export: the data stays yours ──
      const exportJson = () => rtDownload(`hahon-returns-${rtToday()}.json`,
        JSON.stringify(rt, null, 2), 'application/json');
      const exportCsv = () => {
        const nameOf = id => (rt.accounts.find(a => a.id === id) || {}).name || '';
        const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const lines = [['type','account','group','currency','owner','date','value','amount','kind','year','dividends','fees','usdIls'].join(',')];
        rt.accounts.forEach(a => lines.push(['account', esc(a.name), a.group, a.currency, esc(a.owner), '', '', '', '', '', '', '', ''].join(',')));
        rt.values.forEach(v => {
          const a = rt.accounts.find(x => x.id === v.accountId) || {};
          lines.push(['value', esc(nameOf(v.accountId)), a.group || '', a.currency || '', '', v.date, v.value, '', '', '', '', '', ''].join(','));
        });
        rt.flows.forEach(f => {
          const a = rt.accounts.find(x => x.id === f.accountId) || {};
          lines.push(['flow', esc(nameOf(f.accountId)), a.group || '', a.currency || '', '', f.date, '', f.amount, f.kind, '', '', '', ''].join(','));
        });
        rt.income.forEach(i => lines.push(['income', esc(nameOf(i.accountId)), '', '', '', '', '', '', '', i.year, i.dividends, i.fees, ''].join(',')));
        rt.fx.forEach(p => lines.push(['fx', '', '', '', '', p.date, '', '', '', '', '', '', p.usdIls].join(',')));
        rtDownload(`hahon-returns-${rtToday()}.csv`, '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
      };

      const detailRow = detailAcc ? result.rows.find(r => r.account.id === detailAcc) : null;
      const detailAccount = detailAcc ? rt.accounts.find(a => a.id === detailAcc) : null;
      const hasAnything = rt.accounts.length > 0;
      const chip = (label, on, onClick, key) => (
        <button key={key ?? label} className={`rt-chip${on ? ' on' : ''}`} onClick={onClick}>{label}</button>
      );

      return (
        <div className="page-pad">
          {/* ── Returns header ── */}
          <header className="anim-0" style={{ display: 'flex', alignItems: 'center',
            justifyContent: 'space-between', marginBottom: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ width: 34, height: 34, borderRadius: 10, background: 'var(--hero)', color: 'var(--accent)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: '0 4px 10px -4px rgba(11,31,27,0.5)' }}>
                <Icon name="percent" size={16} />
              </div>
              <span className="app-title">תשואות</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span style={{ fontSize: 11, color: rtSync === 'error' ? '#B91C1C' : 'var(--ink-3)' }}>
                {rtSync === 'saving' ? 'שומר…' : rtSync === 'loading' ? 'טוען…' : rtSync === 'error' ? 'שגיאת סנכרון' : ''}
              </span>
              <button className="rt-chip" onClick={onHome}>← ההון שלי</button>
            </div>
          </header>

          {/* ── Tabs ── */}
          <div className="rt-tabbar anim-0">
            {chip('השורה התחתונה', tab === 'main', () => setTab('main'))}
            {chip('חשבונות', tab === 'accounts', () => setTab('accounts'))}
            {chip('הזנה', tab === 'entry', () => setTab('entry'))}
            {chip(result.excluded.length ? `חסרים (${result.excluded.length})` : 'חסרים',
              tab === 'missing', () => setTab('missing'))}
            {chip('ארכיון', tab === 'archive', () => setTab('archive'))}
          </div>

          {/* ── First-run onboarding ── */}
          {!hasAnything && tab === 'main' && (
            <section className="panel-card anim-1" style={{ padding: '30px 28px', textAlign: 'center' }}>
              <div style={{ fontFamily: 'var(--serif)', fontSize: 20, fontWeight: 700, marginBottom: 8 }}>
                כמה הרווחת באמת?
              </div>
              <div style={{ fontSize: 13, color: 'var(--ink-2)', lineHeight: 1.7, maxWidth: 420, margin: '0 auto 18px' }}>
                המסך הזה מפריד בין כסף שהפקדת לכסף שהרוויח. מתחילים מרשימת חשבונות —
                אפשר לייבא אותה בקליק מההון שלי.
              </div>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap' }}>
                <button className="rt-btn" onClick={() => setSheet({ type: 'import' })}>ייבוא מההון שלי</button>
                <button className="rt-btn2" onClick={() => setSheet({ type: 'account', data: null })}>+ חשבון ידני</button>
              </div>
            </section>
          )}

          {/* ── Main tab ── */}
          {hasAnything && tab === 'main' && (
            <>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }} className="anim-0">
                {years.map(y => chip(y, periodId === y, () => setPeriodId(y), `y${y}`))}
                {chip('מאז ההתחלה', periodId === 'all', () => setPeriodId('all'))}
              </div>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 16 }} className="anim-0">
                {chip('הכל', !filter.group && !filter.owner && !filter.account,
                  () => setFilter({ group: null, owner: null, account: null }), 'all')}
                {RT_GROUPS.filter(g => rt.accounts.some(a => a.group === g.id)).map(g =>
                  chip(g.label, filter.group === g.id,
                    () => setFilter(f => ({ ...f, account: null, group: f.group === g.id ? null : g.id })), `g${g.id}`))}
                {owners.map(o =>
                  chip(o, filter.owner === o,
                    () => setFilter(f => ({ ...f, account: null, owner: f.owner === o ? null : o })), `o${o}`))}
                <select className="rt-select" style={{ width: 'auto', padding: '6px 10px', borderRadius: 999, fontSize: 12 }}
                  value={filter.account || ''}
                  onChange={e => setFilter(f => ({ ...f, account: e.target.value || null }))}>
                  <option value="">נכס בודד…</option>
                  {activeAccounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
              <RtLedger result={result}
                onGoMissing={() => setTab('missing')}
                onGoEntry={() => setTab('entry')} />
              <RtBreakdown result={result} />
              <RtContribution result={result} onPick={id => setDetailAcc(id)} />
            </>
          )}

          {tab === 'accounts' && (
            <RtAccountsTab result={result}
              onOpenDetail={id => setDetailAcc(id)}
              onAddAccount={() => setSheet({ type: 'account', data: null })}
              onImport={() => setSheet({ type: 'import' })} />
          )}
          {tab === 'entry' && (
            <RtEntryTab rt={rt} openSheet={setSheet}
              onExportJson={exportJson} onExportCsv={exportCsv}
              onAddFx={addFx} onDeleteFx={deleteFx} />
          )}
          {tab === 'missing' && <RtMissingTab result={result} rt={rt} />}
          {tab === 'archive' && <RtArchiveTab rt={rt} update={update} />}

          {/* ── Sheets ── */}
          {detailAccount && !sheet && (
            <RtAccountDetail acc={detailAccount} rt={rt} row={detailRow}
              openSheet={setSheet} onClose={() => setDetailAcc(null)} />
          )}
          {sheet?.type === 'account' && (
            <RtAccountForm initial={sheet.data}
              onSave={saveAccount}
              onDelete={sheet.data?.id ? () => deleteAccount(sheet.data.id) : null}
              onClose={() => setSheet(null)} />
          )}
          {sheet?.type === 'value' && (
            <RtValueForm initial={sheet.data} accounts={activeAccounts.length ? activeAccounts : rt.accounts}
              documents={rt.documents}
              onSave={rec => saveRec('values', rec)}
              onDelete={sheet.data?.id ? () => deleteRec('values', sheet.data.id) : null}
              onClose={() => setSheet(null)} />
          )}
          {sheet?.type === 'flow' && (
            <RtFlowForm initial={sheet.data} accounts={activeAccounts.length ? activeAccounts : rt.accounts}
              documents={rt.documents}
              onSave={rec => saveRec('flows', rec)}
              onDelete={sheet.data?.id ? () => deleteRec('flows', sheet.data.id) : null}
              onClose={() => setSheet(null)} />
          )}
          {sheet?.type === 'recurring' && (
            <RtRecurringForm accounts={activeAccounts.length ? activeAccounts : rt.accounts}
              onCreate={createRecurring} onClose={() => setSheet(null)} />
          )}
          {sheet?.type === 'income' && (
            <RtIncomeForm initial={sheet.data} accounts={activeAccounts.length ? activeAccounts : rt.accounts}
              onSave={rec => saveRec('income', rec)}
              onDelete={sheet.data?.id ? () => deleteRec('income', sheet.data.id) : null}
              onClose={() => setSheet(null)} />
          )}
          {sheet?.type === 'import' && (
            <RtImportSheet accounts={rt.accounts}
              onImport={importAccounts} onClose={() => setSheet(null)} />
          )}
          {sheet?.type === 'xlsimport' && (
            <RtXlsImportSheet rt={rt}
              onImportRecords={importRecords} onSaveMap={saveImportMap}
              onClose={() => setSheet(null)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // PWA: service worker enables "install app" + offline shell (https/localhost only)
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
