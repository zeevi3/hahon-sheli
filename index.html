    ];

    // ─────────────────────────────────────────────────────
    // APP
    // ─────────────────────────────────────────────────────

    function App() {
      const [appState, setAppState] = useState(() => loadState());
      const [lockCfg, setLockCfg]   = useState(() => loadLock());
      const [locked, setLocked]     = useState(() => !!loadLock());
      const [openKpi, setOpenKpi]   = useState(null); // expanded KPI card (category id)
      const [customCurrencies, setCustomCurrencies] = useState(() => loadCustomCurrencies());
      const [editMode,      setEditMode]      = useState(false);
      const [draftHoldings, setDraftHoldings] = useState(null);
      const [pendingSave,   setPendingSave]   = useState(null); // cleaned holdings awaiting the version choice
      const [openCats,      setOpenCats]      = useState(new Set());
      const [masked,        setMasked]        = useState(() => {
        try { return localStorage.getItem('hahon-masked') === '1'; } catch { return false; }
      });
      const [accent,        setAccent]        = useState(() => {
        try { return localStorage.getItem('hahon-accent') || '#10B981'; } catch { return '#10B981'; }
      });
      // Multi-currency display isn't wired to any UI yet — kept as a plain constant
      // rather than fake state, since there's no selector to change it.
      const currency = 'ILS';
      const [showSettings,  setShowSettings]  = useState(false);
      const [showHistory,   setShowHistory]   = useState(false);
      const [showTable,     setShowTable]     = useState(false);
      const [viewingIdx,    setViewingIdx]    = useState(null);
      const [livePrices, setLivePrices] = useState({}); // ticker → ILS per unit
      const [liveRatesAt,  setLiveRatesAt]    = useState(null);     // Date of last fetch
      const [ratesFetching, setRatesFetching] = useState(false);
      const [syncConfig,   setSyncConfig]     = useState(() => loadSyncConfig());
      const [syncStatus,   setSyncStatus]     = useState('idle'); // idle|loading|saving|ok|error
      const [screen,       setScreen]         = useState('wealth'); // 'wealth' | 'returns'

      useEffect(() => {
        document.documentElement.style.setProperty('--accent', accent);
        try { localStorage.setItem('hahon-accent', accent); } catch {}
      }, [accent]);

      useEffect(() => {
        try { localStorage.setItem('hahon-masked', masked ? '1' : '0'); } catch {}
      }, [masked]);

      // ── Live rate fetching ───────────────────────────────
      const fetchLiveRates = useCallback(async () => {
        setRatesFetching(true);
        // 1. Forex via Frankfurter (ECB-based, covers ILS→USD/EUR/HKD/THB + more)
        try {
          const r = await fetch('https://api.frankfurter.app/latest?base=ILS');
          const d = await r.json();
          if (d.rates) Object.entries(d.rates).forEach(([code, rate]) => { FX[code] = rate; });
        } catch {}

        const prices = {};
        const state = loadState();

        // 2. Crypto via CoinGecko (no API key needed)
        const tickers = [...new Set(
          state.current.crypto.map(c => c.ticker).filter(Boolean)
        )];
        const ids = tickers.map(t => COINGECKO_IDS[t]).filter(Boolean).join(',');
        if (ids) {
          try {
            const r = await fetch(
              `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=ils`
            );
            const d = await r.json();
            tickers.forEach(t => {
              const id = COINGECKO_IDS[t];
              if (id && d[id]?.ils) prices[t] = d[id].ils;
            });
          } catch {}
        }

        // 3. Stocks via Yahoo Finance (runs after forex so USD→ILS conversion is fresh)
        const stockTickers = [...new Set(
          state.current.stocks.map(s => s.ticker).filter(Boolean)
        )];
        await Promise.allSettled(stockTickers.map(async t => {
          const p = await fetchYahooPriceILS(t);
          if (p != null) prices[t] = p;
        }));

        setLivePrices(prices);
        setLiveRatesAt(new Date());
        setRatesFetching(false);
      }, []);

      useEffect(() => { fetchLiveRates(); }, []);

      // ── JSONBin: load on mount if configured ─────────────
      useEffect(() => {
        if (!syncConfig) return;
        setSyncStatus('loading');
        fetchFromJsonBin(syncConfig)
          .then(data => {
            if (data) {
              delete data.returns; // owned by the returns screen — must never enter appState
              // Version migration: clear snapshots if data is from an older version
              const needsMigration = !data.version || data.version < DATA_VER;
              if (needsMigration) {
                data.snapshots = [];
                data.version = DATA_VER;
              }
              if (data.current && Object.keys(data.current).length > 0) {
                data.current = normalizeHoldings(data.current);
                migrateHoldings(data.current);
                (data.snapshots || []).forEach(s => {
                  s.holdings = normalizeHoldings(s.holdings || {});
                  migrateHoldings(s.holdings);
                });
                setAppState(data);
                saveState(data);
                // Re-save to JSONBin if we migrated
                if (needsMigration) pushToJsonBin(syncConfig, data);
              }
            }
            setSyncStatus('ok');
          })
          .catch(() => setSyncStatus('error'));
      }, []); // only on mount

      // Which holdings are displayed (current vs. historical snapshot)
      const displayHoldings = useMemo(() => {
        if (viewingIdx !== null && appState.snapshots[viewingIdx]) {
          return appState.snapshots[viewingIdx].holdings;
        }
        return appState.current;
      }, [appState, viewingIdx]);

      // Live draft (for editing) or displayed holdings
      const activeHoldings = editMode ? draftHoldings : displayHoldings;

      const { catTotals, total: netWorth } = useMemo(
        () => calcNetWorth(activeHoldings || displayHoldings, livePrices),
        [activeHoldings, displayHoldings, liveRatesAt, livePrices]
      );

      // Previous period (last snapshot) — holdings, totals and per-item lookup
      const prevHoldings = useMemo(() => {
        const snaps = appState.snapshots;
        if (viewingIdx !== null) {
          return viewingIdx > 0 ? snaps[viewingIdx - 1].holdings : null;
        }
        return snaps.length > 0 ? snaps[snaps.length - 1].holdings : null;
      }, [appState, viewingIdx]);

      const prevCalc = useMemo(
        () => prevHoldings ? calcNetWorth(prevHoldings) : null,
        [prevHoldings]
      );
      const prevNetWorth  = prevCalc ? prevCalc.total : null;
      const prevCatTotals = prevCalc ? prevCalc.catTotals : null;

      // Per-item previous values, keyed by _rid (stable) with name fallback
      const getPrevItemVal = useMemo(() => {
        if (!prevHoldings) return () => null;
        const map = {};
        CAT_META.forEach(c => (prevHoldings[c.id] || []).forEach(it => {
          const v = itemILS(c.id, it);
          if (it._rid) map[`${c.id}|r|${it._rid}`] = v;
          if (it.name) map[`${c.id}|n|${it.name}`] = v;
        }));
        return (catId, item) =>
          map[`${catId}|r|${item._rid}`] ?? map[`${catId}|n|${item.name}`] ?? null;
      }, [prevHoldings]);

      const liquidTotal = (catTotals.savings || 0) + (catTotals.stocks || 0) + (catTotals.crypto || 0) + (catTotals.bank || 0);

      const wow    = prevNetWorth != null ? netWorth - prevNetWorth : 0;
      const wowPct = prevNetWorth > 0 ? (wow / prevNetWorth) * 100 : 0;
      // Hide change if there's no history or it's unreasonably large (stale/corrupt snapshot)
      const showWow = prevNetWorth > 0 && Math.abs(wowPct) < 30;

      // ── Edit mode ────────────────────────────────────────
      const startEdit = () => {
        const draft = JSON.parse(JSON.stringify(appState.current));
        // Add string-edit fields so inputs can hold intermediate strings (e.g. "" while typing)
        // while the numeric `value`/`aftertax`/`marketValue` stay in sync for live totals.
        Object.keys(draft).forEach(catId => {
          draft[catId].forEach(item => {
            item._touched = false; // red until the amount is confirmed (Enter / blur)
            item._dirty   = false; // typed into, but not confirmed yet
            if (catId === 'crypto') {
              const liveMarket = livePrices[item.ticker]
                ? Math.round(livePrices[item.ticker] * (item.qty || 0))
                : (item.marketValue || 0);
              item._editMarket  = String(liveMarket);
              item._editQty     = String(item.qty    ?? 0);
              item._editTicker  = item.ticker || '';
            } else if (catId === 'bank') {
              item._editForeignAmount = String(item.foreignAmount ?? item.value ?? 0);
              item._editCurrency      = item.currency || 'ILS';
            } else {
              // Stocks with a live ticker open pre-filled with the live value
              const live = catId === 'stocks' ? liveTickerValue(item, livePrices) : null;
              item._edit = String(live != null ? Math.round(live) : (item.value || 0));
              if (catId === 'stocks') {
                item._editQty    = String(item.qty ?? '');
                item._editTicker = item.ticker || '';
              }
            }
          });
        });
        setDraftHoldings(draft);
        setEditMode(true);
        setShowSettings(false);
        setOpenCats(new Set(CAT_META.map(c => c.id)));
      };

      const cancelEdit = () => {
        setEditMode(false);
        setDraftHoldings(null);
        setPendingSave(null);
      };

      const saveEdit = () => {
        // Strip _edit fields and ensure numeric values are finalised from the strings
        const clean = JSON.parse(JSON.stringify(draftHoldings));
        Object.keys(clean).forEach(catId => {
          clean[catId].forEach(item => {
            if (catId === 'crypto') {
              item.marketValue = parseFloat(String(item._editMarket  || '').replace(/,/g,'')) || 0;
              item.qty         = parseFloat(String(item._editQty     || '').replace(/,/g,'')) || 0;
              item.ticker      = (item._editTicker || '').trim().toUpperCase();
              delete item._editMarket;
              delete item._editQty;
              delete item._editTicker;
            } else if (catId === 'bank') {
              item.foreignAmount = parseFloat(String(item._editForeignAmount || '').replace(/,/g,'')) || 0;
              item.currency      = item._editCurrency || 'ILS';
              delete item._editForeignAmount;
              delete item._editCurrency;
            } else {
              item.value = parseFloat(String(item._edit || '').replace(/,/g,'')) || 0;
              delete item._edit;
              if (catId === 'stocks') {
                item.qty    = parseFloat(String(item._editQty || '').replace(/,/g,'')) || 0;
                item.ticker = (item._editTicker || '').trim().toUpperCase();
                delete item._editQty;
                delete item._editTicker;
                // Snapshot the live value so history stays accurate even offline
                const live = liveTickerValue(item, livePrices);
                if (live != null) item.value = Math.round(live);
              }
            }
            delete item._touched;
            delete item._dirty;
          });
        });

        // Saving twice on the same day would otherwise stack up near-identical
        // versions. Let the user fold this save into today's version instead.
        const lastSnap = appState.snapshots[appState.snapshots.length - 1];
        if (lastSnap && isSameDay(lastSnap.date, new Date())) {
          setPendingSave(clean);
          return;
        }
        commitSave(clean, true);
      };

      // addVersion=false folds the save into today's existing version: `current` is
      // replaced but no new snapshot is pushed, so history keeps one entry per day.
      const commitSave = (clean, addVersion) => {
        const newSnapshot = {
          id: Date.now().toString(),
          date: new Date().toISOString(),
          label: new Date().toLocaleDateString('he-IL'),
          holdings: JSON.parse(JSON.stringify(appState.current)), // old state → history
        };
        const newState = {
          current: clean,
          snapshots: addVersion ? [...appState.snapshots, newSnapshot] : appState.snapshots,
          version: DATA_VER, // without this, loadState wipes snapshots on next load
        };
        setAppState(newState);
        saveState(newState);
        setPendingSave(null);
        setEditMode(false);
        setDraftHoldings(null);
        setViewingIdx(null);
        fetchLiveRates(); // pick up prices for tickers added in this edit
        if (syncConfig) {
          setSyncStatus('saving');
          pushToJsonBin(syncConfig, newState)
            .then(() => setSyncStatus('ok'))
            .catch(() => setSyncStatus('error'));
        }
      };

      const deleteSnapshot = (idx) => {
        if (!confirm(`למחוק את העדכון מ-${formatDate(appState.snapshots[idx].date)}?`)) return;
        const newState = {
          ...appState,
          snapshots: appState.snapshots.filter((_, i) => i !== idx),
          version: DATA_VER,
        };
        setAppState(newState);
        saveState(newState);
        setViewingIdx(null);
        if (syncConfig) {
          setSyncStatus('saving');
          pushToJsonBin(syncConfig, newState)
            .then(() => setSyncStatus('ok'))
            .catch(() => setSyncStatus('error'));
        }
      };

      const onValueChange = useCallback((catId, itemIdx, updates) => {
        setDraftHoldings(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          Object.assign(next[catId][itemIdx], updates);
          return next;
        });
      }, []);

      const onAddItem = useCallback((catId) => {
        setDraftHoldings(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          let newItem;
          if (catId === 'crypto') {
            newItem = { name: '', ticker: '', qty: 0, value: null, marketValue: 0,
                        _editMarket: '0', _editQty: '0', _editTicker: '' };
          } else if (catId === 'bank') {
            newItem = { name: '', foreignAmount: 0, currency: 'ILS', note: '',
                        _editForeignAmount: '0', _editCurrency: 'ILS' };
          } else {
            newItem = { name: '', value: 0, note: '', _edit: '0' };
          }
          newItem._rid = nextRid();
          newItem._touched = false; // stays red until its amount is confirmed
          newItem._dirty   = false;
          next[catId].push(newItem);
          return next;
        });
      }, []);

      const onDeleteItem = useCallback((catId, itemIdx) => {
        setDraftHoldings(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          next[catId].splice(itemIdx, 1);
          return next;
        });
      }, []);

      const onAddCurrency = useCallback((code, rate, sym) => {
        FX[code]  = rate;
        SYM[code] = sym || code;
        const updated = { ...customCurrencies, [code]: { rate, sym: sym || code } };
        setCustomCurrencies(updated);
        try { localStorage.setItem(CUSTOM_CUR_KEY, JSON.stringify(updated)); } catch {}
      }, [customCurrencies]);

      // ── Sync callbacks ───────────────────────────────────
      const onSyncConnect = useCallback(async (cfg) => {
        if (!cfg.binId) {
          // No Bin ID — create a fresh private bin seeded with this device's data
          const binId = await createJsonBin(cfg.apiKey, appState);
          cfg = { ...cfg, binId };
        } else {
          const data = await fetchFromJsonBin(cfg);
          if (data) delete data.returns; // owned by the returns screen
          if (data && data.current) {
            migrateHoldings(data.current);
            (data.snapshots || []).forEach(s => migrateHoldings(s.holdings));
            setAppState(data);
            saveState(data);
          } else {
            // Bin is empty — push current data up
            await pushToJsonBin(cfg, appState);
          }
        }
        saveSyncConfig(cfg);
        setSyncConfig(cfg);
        setSyncStatus('ok');
      }, [appState]);

      const onSyncDisconnect = useCallback(() => {
        try { localStorage.removeItem(SYNC_CFG_KEY); } catch {}
        setSyncConfig(null);
        setSyncStatus('idle');
      }, []);

      // ── App lock handlers ─────────────────────────────
      const onSetPin = useCallback(async (pin) => {
        const salt = randHex(8);
        const pinHash = await hashPin(pin, salt);
        const cfg = { ...(lockCfg || {}), salt, pinHash };
        saveLock(cfg);
        setLockCfg(cfg);
      }, [lockCfg]);

      const onEnableBio = useCallback(async () => {
        const credId = await registerBiometric();
        const cfg = { ...(lockCfg || {}), credId };
        saveLock(cfg);
        setLockCfg(cfg);
      }, [lockCfg]);

      const onDisableLock = useCallback(() => {
        saveLock(null);
        setLockCfg(null);
        setLocked(false);
      }, []);

      const onResetHistory = useCallback(() => {
        const newState = { current: appState.current, snapshots: [], version: DATA_VER };
        setAppState(newState);
        saveState(newState);
        if (syncConfig) {
          setSyncStatus('saving');
          pushToJsonBin(syncConfig, newState)
            .then(() => setSyncStatus('ok'))
            .catch(() => setSyncStatus('error'));
        }
      }, [appState, syncConfig]);

      const onSyncNow = useCallback(() => {
        if (!syncConfig) return;
        setSyncStatus('saving');
        pushToJsonBin(syncConfig, appState)
          .then(() => setSyncStatus('ok'))
          .catch(() => setSyncStatus('error'));
      }, [syncConfig, appState]);

      const toggleCat = id => {
        setOpenCats(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };

      const isViewing = viewingIdx !== null;
      const viewingSnap = isViewing ? appState.snapshots[viewingIdx] : null;

      return (
        <div dir="rtl" style={{ minHeight:'100vh' }}>

          {/* ── Lock gate ── */}
          {locked && lockCfg && (
            <LockScreen lock={lockCfg} onUnlock={() => setLocked(false)} />
          )}

          {/* ── Edit banner ── */}
          {editMode && (() => {
            const allItems  = Object.values(draftHoldings || {}).flat();
            const doneCount = allItems.filter(it => it._touched).length;
            return (
            <div className="edit-banner">
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <span style={{ fontSize:13, fontWeight:600, color:'#065F46' }}>✏ מצב עריכה</span>
                <span style={{ fontSize:12, fontWeight:600, color: doneCount === allItems.length ? '#059669' : '#B45309',
                               fontVariantNumeric:'tabular-nums' }}>
                  עודכנו {doneCount} מתוך {allItems.length}
                </span>
                <span style={{ fontSize:12, color:'#059669' }}>
                  שדות באדום — טרם עודכנו · לחץ Enter או צא מהשדה לאישור
                </span>
              </div>
              <div className="edit-banner-btns">
                <button className="btn-cancel" onClick={cancelEdit}>ביטול</button>
                <button className="btn-save" onClick={saveEdit}>שמור עדכון</button>
              </div>
            </div>
            );
          })()}

          {/* ── Save: update today's version, or open a new one ── */}
          {pendingSave && (() => {
            const lastSnap = appState.snapshots[appState.snapshots.length - 1];
            const newTotal = calcNetWorth(pendingSave, livePrices).total;
            return (
              <>
                <div className="history-overlay" onClick={() => setPendingSave(null)} />
                <div style={{ position:'fixed', zIndex:1000, top:'50%', left:'50%',
                  transform:'translate(-50%,-50%)', width:'min(400px, 92vw)',
                  background:'var(--surface)', borderRadius:16, padding:'22px 24px',
                  boxShadow:'0 20px 60px -12px rgba(11,31,27,0.35)', direction:'rtl' }}>
                  <div style={{ fontSize:16, fontWeight:700, color:'var(--ink)', marginBottom:8 }}>
                    כבר קיים עדכון מהיום
                  </div>
                  <div style={{ fontSize:13, color:'var(--ink-2)', lineHeight:1.6, marginBottom:18 }}>
                    שמרת עדכון היום ({formatDate(lastSnap.date)}). אפשר לעדכן את אותה גרסה
                    במקום להוסיף עוד אחת להיסטוריה.
                    <div className="number-val" style={{ marginTop:10, fontSize:14, fontWeight:700,
                      color:'var(--ink)', direction:'ltr', textAlign:'right' }}>
                      {maskVal(fmt(newTotal), masked)}
                    </div>
                  </div>
                  <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                    <button className="btn-save" onClick={() => commitSave(pendingSave, false)}
                      style={{ padding:'10px 18px', fontSize:13 }}>
                      עדכן את הגרסה של היום
                    </button>
                    <button className="btn-cancel" onClick={() => commitSave(pendingSave, true)}
                      style={{ padding:'10px 18px', fontSize:13 }}>
                      צור גרסה חדשה
                    </button>
                    <button onClick={() => setPendingSave(null)}
                      style={{ background:'none', border:'none', fontFamily:'inherit',
                        fontSize:12, color:'var(--ink-3)', cursor:'pointer', padding:'4px 0' }}>
                      חזור לעריכה
                    </button>
                  </div>
                </div>
              </>
            );
          })()}

          {/* ── Viewing history banner ── */}
          {isViewing && !editMode && (
            <div className="history-banner">
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ fontSize:13, fontWeight:600, color:'#92400E' }}>
                  ⏱ מציג: {formatDate(viewingSnap.date)}
                </span>
              </div>
              <button onClick={() => setViewingIdx(null)}
                style={{ background:'#FDE68A', border:'1px solid #FCD34D', borderRadius:8,
                         padding:'6px 14px', fontSize:12, fontWeight:600, color:'#92400E', cursor:'pointer' }}>
                חזרה להיום
              </button>
            </div>
          )}

          {screen === 'wealth' && <div className="page-pad">

            {/* ── Top bar ── */}
            <header className="anim-0" style={{ display:'flex', alignItems:'center',
              justifyContent:'space-between', marginBottom:24 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <div style={{ width:34, height:34, borderRadius:10, background:'var(--hero)', color:accent,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  boxShadow:'0 4px 10px -4px rgba(11,31,27,0.5)' }}>
                  <Icon name="trend" size={17} />
                </div>
                <span className="app-title">ההון שלי</span>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <span style={{ fontSize:11, color:'var(--ink-3)' }}>
                  {isViewing
                    ? formatDate(viewingSnap.date)
                    : appState.snapshots.length > 0
                      ? `עודכן ${timeSinceLabel(appState.snapshots[appState.snapshots.length - 1].date)}`
                      : ''}
                </span>
                <IconBtn onClick={() => { setScreen('returns'); setShowTable(false); setShowHistory(false); setShowSettings(false); }}
                  title="תשואות"><Icon name="percent" size={15} /></IconBtn>
                <IconBtn onClick={() => { setShowTable(v=>!v); setShowHistory(false); setShowSettings(false); }}
                  title="נכסים לאורך זמן" active={showTable}><Icon name="table" size={15} /></IconBtn>
                <IconBtn onClick={() => { setShowHistory(v=>!v); setShowSettings(false); }}
                  title="היסטוריה" active={showHistory}><Icon name="history" size={15} /></IconBtn>
                <IconBtn onClick={() => {
                    if (isViewing) { setViewingIdx(null); return; }
                    if (editMode) { cancelEdit(); return; }
                    startEdit();
                  }}
                  title={editMode ? 'ביטול עריכה' : 'עריכה'}
                  active={editMode}><Icon name="pencil" size={14} /></IconBtn>
                <Avatar name="יהונתן יעל" size={32} />
              </div>
            </header>

            {/* ── Hero card ── */}
            <section className="anim-1 hero-card">

              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16 }}>
                <span style={{ width:6, height:6, borderRadius:999, background:accent,
                               boxShadow:`0 0 10px ${accent}` }} />
                <span style={{ fontSize:11, fontWeight:700, color:'rgba(244,251,248,0.55)',
                               letterSpacing:'0.14em', textTransform:'uppercase' }}>סך הון עצמי</span>
              </div>

              <div className={`hero-number number-val${masked?' masked':''}`}>
                {maskVal(fmt(netWorth, currency), masked)}
              </div>

              <div style={{ display:'flex', gap:12, alignItems:'center', marginTop:14 }}>
                {showWow && <Pill color={wow >= 0 ? '#34D399' : '#F87171'}>{wow >= 0 ? '↑' : '↓'} {Math.abs(wowPct).toFixed(2)}%</Pill>}
                <span style={{ fontSize:13, color:'rgba(244,251,248,0.65)' }}>
                  {isViewing ? 'לעומת עדכון קודם' : (() => {
                    const snaps = appState.snapshots;
                    const label = snaps.length > 0
                      ? timeSinceLabel(snaps[snaps.length - 1].date)
                      : null;
                    return label ? `עודכן ${label}` : '';
                  })()}{' '}
                  {showWow && <strong className={`number-val${masked?' masked':''}`}
                    style={{ fontVariantNumeric:'tabular-nums', color:'#F4FBF8' }}>
                    {maskVal(fmt(wow, currency, { compact:true, sign:true }), masked)}
                  </strong>}
                </span>
              </div>

              {/* Net-worth history chart */}
              {!editMode && (
                <NetWorthChart snapshots={appState.snapshots}
                  currentTotal={calcNetWorth(appState.current, livePrices).total}
                  masked={masked} accent={accent} />
              )}

              {/* Pension + Liquid breakdown */}
              <div className="hero-split" style={{ display:'flex', gap:0, marginTop:22, marginBottom:4,
                            borderTop:'1px solid rgba(255,255,255,0.09)', paddingTop:18 }}>
                {[
                  { label:'פנסיה', val: catTotals.pension, note:'נעול עד פרישה' },
                  { label:'נזיל',  val: liquidTotal,        note:'מניות · חסכונות · קריפטו · בנק' },
                ].map((seg, i) => (
                  <div key={seg.label} style={{
                    flex:1, paddingRight: i===0 ? 28 : 0, paddingLeft: i===1 ? 0 : 28,
                    borderRight: i===0 ? '1px solid rgba(255,255,255,0.09)' : 'none',
                  }}>
                    <div style={{ fontSize:10, fontWeight:700, color:'rgba(244,251,248,0.5)',
                                  letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:6 }}>
                      {seg.label}
                    </div>
                    <div className={`number-val${masked?' masked':''}`}
                         style={{ fontSize:23, fontWeight:600, letterSpacing:'-0.02em',
                                  fontFamily:'var(--serif)', color:'#FFFFFF',
                                  direction:'ltr', textAlign:'right' }}>
                      {maskVal(fmt(seg.val, currency), masked)}
                    </div>
                    <div style={{ fontSize:10, color:'rgba(244,251,248,0.45)', marginTop:3 }}>{seg.note}</div>
                  </div>
                ))}
              </div>

              {/* Allocation strip */}
              <AllocationBar catTotals={catTotals} masked={masked} />

              {/* KPI cards — expandable per-category breakdown */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(170px, 1fr))',
                            gap:12, marginTop:26, alignItems:'start' }}>
                {CAT_META.map(cat => (
                  <KpiCard key={cat.id} cat={{ ...cat, items: activeHoldings[cat.id] }}
                    catTotal={catTotals[cat.id]} prevTotal={prevCatTotals?.[cat.id]}
                    masked={masked} currency={currency}
                    open={openKpi === cat.id}
                    onToggle={() => setOpenKpi(v => v === cat.id ? null : cat.id)}
                    livePrices={livePrices}
                    getPrevItemVal={editMode ? null : getPrevItemVal}
                    customCurrencies={customCurrencies} />
                ))}
              </div>
            </section>

            {/* ── Holdings panel (on mobile it's hidden in view mode — the KPI cards expand instead) ── */}
            <section className={`anim-2 panel-card holdings-panel${editMode ? '' : ' view-only'}`}>

              <div style={{ padding:'22px 26px 16px', display:'flex', justifyContent:'space-between',
                alignItems:'center', borderBottom:'1px solid var(--border-2)' }}>
                <div>
                  <div style={{ fontSize:11, fontWeight:700, color:'var(--ink-3)',
                                letterSpacing:'0.12em', textTransform:'uppercase' }}>החזקות</div>
                  <div style={{ fontSize:11, color:'var(--ink-3)', marginTop:3, display:'flex', alignItems:'center', gap:6 }}>
                    {CAT_META.reduce((s,c) => s + activeHoldings[c.id].length, 0)} פריטים
                    {editMode && <span style={{ color:'#10B981', fontWeight:600 }}>· מצב עריכה</span>}
                    {liveRatesAt && !editMode && (
                      <span style={{ display:'inline-flex', alignItems:'center', gap:4 }}>
                        <span style={{ width:5, height:5, borderRadius:'50%', background:'#10B981' }} />
                        שערים חיים · {liveRatesAt.toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' })}
                      </span>
                    )}
                  </div>
                </div>
                <div style={{ display:'flex', gap:6 }}>
                  {[['פתח הכל', () => setOpenCats(new Set(CAT_META.map(c=>c.id)))],
                    ['סגור הכל', () => setOpenCats(new Set())]].map(([label, fn]) => (
                    <button key={label} onClick={fn}
                      style={{ fontSize:11, fontWeight:600, color:'var(--ink-2)',
                        padding:'5px 12px', borderRadius:999,
                        background:'var(--bg)', border:'1px solid var(--border)', cursor:'pointer' }}
                      onMouseEnter={e => e.currentTarget.style.background='var(--border)'}
                      onMouseLeave={e => e.currentTarget.style.background='var(--bg)'}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>

              {CAT_META.map(cat => (
                <CategoryAccordion
                  key={cat.id} cat={cat}
                  catTotal={catTotals[cat.id]}
                  items={activeHoldings[cat.id]}
                  isOpen={openCats.has(cat.id)}
                  onToggle={() => toggleCat(cat.id)}
                  editMode={editMode && !isViewing}
                  onValueChange={onValueChange}
                  onAddItem={onAddItem}
                  onDeleteItem={onDeleteItem}
                  masked={masked} currency={currency}
                  isCrypto={cat.isCrypto}
                  customCurrencies={customCurrencies}
                  onAddCurrency={onAddCurrency}
                  livePrices={livePrices}
                  getPrevItemVal={editMode ? null : getPrevItemVal}
                />
              ))}

              <div style={{ padding:'12px 26px 18px', borderTop:'1px solid var(--border-2)',
                fontSize:11, color:'var(--ink-3)', lineHeight:1.6 }}>
                * קריפטו מוצג בשווי שוק.
              </div>
            </section>
          </div>}

          {/* ── Returns screen (isolated world — its own storage & sync field) ── */}
          {screen === 'returns' && (
            <ReturnsErrorBoundary onHome={() => setScreen('wealth')}>
              <ReturnsApp syncConfig={syncConfig} onHome={() => setScreen('wealth')} />
            </ReturnsErrorBoundary>
          )}

          {/* ── Assets-over-time table ── */}
          {showTable && (
            <TableView appState={appState} livePrices={livePrices}
              masked={masked} onClose={() => setShowTable(false)} />
          )}

          {/* ── History panel ── */}
          {showHistory && (
            <HistoryPanel
              snapshots={appState.snapshots}
              currentNetWorth={calcNetWorth(appState.current).total}
              viewingIdx={viewingIdx}
              onView={idx => { setViewingIdx(idx); setShowHistory(false); setEditMode(false); }}
              onDelete={deleteSnapshot}
              onClose={() => setShowHistory(false)}
            />
          )}

          {/* ── Settings ── */}
          {showSettings && (
            <SettingsPanel masked={masked} onMaskToggle={() => setMasked(v=>!v)}
              accent={accent} onAccentChange={setAccent}
              onClose={() => setShowSettings(false)}
              syncConfig={syncConfig} syncStatus={syncStatus}
              onSyncConnect={onSyncConnect}
              onSyncDisconnect={onSyncDisconnect}
              onSyncNow={onSyncNow}
              onResetHistory={onResetHistory}
              lock={lockCfg} onSetPin={onSetPin}
              onEnableBio={onEnableBio} onDisableLock={onDisableLock} />
          )}

          {/* ── Settings trigger ── */}
          {!showSettings && !editMode && screen === 'wealth' && (
            <button onClick={() => { setShowSettings(true); setShowHistory(false); }}
              title="הגדרות"
              style={{ position:'fixed', bottom:20, right:20, width:42, height:42,
                borderRadius:12, background:'var(--ink)', color:accent, border:'none',
                display:'flex', alignItems:'center', justifyContent:'center', fontSize:18,
                cursor:'pointer', zIndex:900,
                boxShadow:'0 4px 16px rgba(0,0,0,0.2)',
                transition:'transform 0.15s' }}
              onMouseEnter={e => e.currentTarget.style.transform='scale(1.06)'}
              onMouseLeave={e => e.currentTarget.style.transform='scale(1)'}>
              <Icon name="gear" size={18} />
            </button>

    // ═════════════════════════════════════════════════════
    // RETURNS SCREEN — "תשואות"
    // Fully additive module. Own localStorage key (hahon-returns-v1),
    // own top-level bin field (returns). Reads appState only via the
    // one-time import (read-only). Never writes to hahon-sheli-v3.
    // ═════════════════════════════════════════════════════

    const RT_KEY = 'hahon-returns-v1';
    const RT_SB_KEY = 'hahon-returns-supabase'; // { url, anonKey } — per device, not synced
    const RT_BUCKET = 'reports';

    const RT_GROUPS = [
      { id: 'hishtalmut', label: 'קרן השתלמות' },
      { id: 'gemel',      label: 'גמל להשקעה' },
      { id: 'kids',       label: 'חיסכון לילדים' },
      { id: 'broker',     label: 'ניירות ערך' },
      { id: 'crypto',     label: 'קריפטו' },
      { id: 'other',      label: 'אחר' },
    ];
    const rtGroupLabel = id => (RT_GROUPS.find(g => g.id === id) || {}).label || id;

    const RT_SYM = { ILS: '₪', USD: '$' };
    // Deliberate palette exception: losses in muted ochre-brown, not alarm red
    const RT_NEG = '#9A5B44';       // on light surfaces
    const RT_NEG_DARK = '#CE9B7E';  // on the dark hero card

    // ── Storage ──────────────────────────────────────────
    function rtEmpty() {
      return { version: 1, accounts: [], values: [], flows: [], income: [], fx: [], documents: [], importMaps: [], updatedAt: null };
    }
    function rtNormalize(s) {
      if (!s || typeof s !== 'object') return rtEmpty();
      return {
        version: 1,
        accounts:  Array.isArray(s.accounts)   ? s.accounts   : [],
        values:    Array.isArray(s.values)     ? s.values     : [],
        flows:     Array.isArray(s.flows)      ? s.flows      : [],
        income:    Array.isArray(s.income)     ? s.income     : [],
        fx:        Array.isArray(s.fx)         ? s.fx         : [],
        documents: Array.isArray(s.documents)  ? s.documents  : [],
        importMaps: Array.isArray(s.importMaps) ? s.importMaps : [],
        updatedAt: s.updatedAt || null,
      };
    }
    function rtLoad() {
      try {
        const raw = localStorage.getItem(RT_KEY);
        if (raw) return rtNormalize(JSON.parse(raw));
      } catch {}
      return rtEmpty();
    }
    function rtSaveLocal(s) {
      try { localStorage.setItem(RT_KEY, JSON.stringify(s)); } catch {}
    }

    // Push only the `returns` field: read the whole bin, replace that one
    // field, write back — sibling fields (current/snapshots/version) untouched.
    async function pushReturnsToBin(cfg, returnsState) {
      let remote = {};
      try { remote = await fetchFromJsonBin(cfg) || {}; } catch {}
      if (typeof remote !== 'object' || Array.isArray(remote)) remote = {};
      await putJsonBin(cfg, { ...remote, returns: returnsState });
    }

    // ── Formatting ───────────────────────────────────────
    function rtFmt(n, cur = 'ILS', { sign = false, dec = 0 } = {}) {
      if (n == null || isNaN(n)) return '—';
      const s = n < 0 ? '−' : (sign && n > 0 ? '+' : '');
      const v = Math.abs(n);
      return `${s}${RT_SYM[cur] || cur} ${v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })}`;
    }
    function rtFmtPct(x) {
      if (x == null || !isFinite(x)) return '—';
      return `${x < 0 ? '−' : ''}${Math.abs(x * 100).toFixed(1)}%`;
    }
    function rtFmtDate(d) { // 'YYYY-MM-DD' → '1.1.25'
      if (!d) return '—';
      const [y, m, dd] = d.split('-');
      return `${+dd}.${+m}.${y.slice(2)}`;
    }
    const rtDay   = d => new Date(d + 'T00:00:00Z').getTime();
    const rtToday = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const RT_DAY_MS = 86400000;

    // ── XIRR (money-weighted annual return) ──────────────
    // Bisection over rate ∈ (−0.9999, 10). Requires at least one positive
    // and one negative cashflow — otherwise returns null (never invent a number).
    function rtXirr(flows) {
      const fs = (flows || []).filter(f => f && f.amount !== 0 && f.date != null && isFinite(f.amount));
      if (fs.length < 2) return null;
      if (!fs.some(f => f.amount > 0) || !fs.some(f => f.amount < 0)) return null;
      const t0 = Math.min(...fs.map(f => f.date));
      const yrs = f => (f.date - t0) / (365.25 * RT_DAY_MS);
      const npv = r => fs.reduce((s, f) => s + f.amount / Math.pow(1 + r, yrs(f)), 0);
      let lo = -0.9999, hi = 10;
      let fLo = npv(lo), fHi = npv(hi);
      if (!isFinite(fLo) || !isFinite(fHi) || fLo * fHi > 0) return null;
      for (let i = 0; i < 200; i++) {
        const mid = (lo + hi) / 2;
        const fMid = npv(mid);
        if (!isFinite(fMid)) return null;
        if (Math.abs(fMid) < 1e-7 || (hi - lo) < 1e-9) return mid;
        if (fLo * fMid <= 0) { hi = mid; fHi = fMid; }
        else                 { lo = mid; fLo = fMid; }
      }
      return (lo + hi) / 2;
    }

    // ── USD/ILS rate at a date, from user-entered points ─
    // Linear interpolation inside the range. Up to 31 days outside the
    // range — nearest point, flagged approximate. Further — null (missing).
    function rtFx(fxPoints, date) {
      const pts = (fxPoints || [])
        .filter(p => p.date && p.usdIls > 0)
        .sort((a, b) => a.date.localeCompare(b.date));
      if (!pts.length || !date) return { rate: null, approx: false };
      const t = rtDay(date);
      if (date <= pts[0].date) {
        const gap = (rtDay(pts[0].date) - t) / RT_DAY_MS;
        return gap <= 31 ? { rate: pts[0].usdIls, approx: gap > 0 } : { rate: null, approx: false };
      }
      const last = pts[pts.length - 1];
      if (date >= last.date) {
        const gap = (t - rtDay(last.date)) / RT_DAY_MS;
        return gap <= 31 ? { rate: last.usdIls, approx: gap > 0 } : { rate: null, approx: false };
      }
      for (let i = 1; i < pts.length; i++) {
        if (date <= pts[i].date) {
          const a = pts[i - 1], b = pts[i];
          const ta = rtDay(a.date), tb = rtDay(b.date);
          const f = tb === ta ? 0 : (t - ta) / (tb - ta);
          return { rate: a.usdIls + f * (b.usdIls - a.usdIls), approx: false };
        }
      }
      return { rate: null, approx: false };
    }

    // Closest value record on-or-before the target date; if none exists,
    // the closest one after. Gaps > 31 days are surfaced as warnings.
    function rtValueNear(records, target) {
      if (!records.length) return null;
      const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
      let pick = null;
      for (const r of sorted) { if (r.date <= target) pick = r; else break; }
      if (!pick) pick = sorted[0];
      const gapDays = Math.round(Math.abs(rtDay(pick.date) - rtDay(target)) / RT_DAY_MS);
      return { ...pick, gapDays };
    }

    function rtPeriod(periodId, state, accountIds) {
      const today = rtToday();
      if (periodId === 'all') {
        const dates = state.values.filter(v => accountIds.has(v.accountId)).map(v => v.date).sort();
        return { start: dates[0] || today, end: today, label: 'מאז ההתחלה' };
      }
      const end = `${periodId}-12-31` < today ? `${periodId}-12-31` : today;
      return { start: `${periodId}-01-01`, end, label: `שנת ${periodId}` };
    }

    // ── Per-account return over a period ─────────────────
    // profit = close − open − (deposits − withdrawals), in account currency.
    // Dividends/fees are already embedded in the closing value — they are a
    // breakdown of the profit, never added to it.
    function rtComputeAccount(acc, state, period) {
      const res = {
        account: acc, ok: false, missing: [], warnings: [],
        open: null, close: null, deposits: 0, withdrawals: 0,
        profit: null, xirrLocal: null,
        openILS: null, closeILS: null, netFlowsILS: null,
        profitILS: null, currencyEffect: null, flowsILS: null,
        fxMissing: false, lastValue: null,
      };
      const vals = state.values.filter(v => v.accountId === acc.id);
      if (vals.length) res.lastValue = [...vals].sort((a, b) => a.date.localeCompare(b.date))[vals.length - 1];
      if (!vals.length) { res.missing.push('אין אף רשומת שווי'); return res; }

      const inRange = vals.filter(v => v.date <= period.end);
      if (!inRange.length) { res.missing.push(`אין שווי עד ${rtFmtDate(period.end)}`); return res; }
      const open  = rtValueNear(inRange, period.start);
      const close = rtValueNear(inRange, period.end); // on-or-before end by construction
      res.open = open; res.close = close;

      if (open.date === close.date) {
        res.missing.push(`חסר שווי ל־${rtFmtDate(period.start)} (יש רק רשומה אחת בתקופה)`);
        return res;
      }
      if (open.date > period.start && open.gapDays > 31) {
        res.warnings.push(`שווי פתיחה מ־${rtFmtDate(open.date)}, לא מ־${rtFmtDate(period.start)}`);
      } else if (open.gapDays > 31) {
        res.warnings.push(`שווי פתיחה ישן — מ־${rtFmtDate(open.date)} (${open.gapDays} ימים מ־${rtFmtDate(period.start)})`);
      }
      if (close.gapDays > 31) {
        res.warnings.push(`שווי סגירה מ־${rtFmtDate(close.date)}, לא מ־${rtFmtDate(period.end)}`);
      }

      // Flows strictly after the opening valuation, up to the closing one
      const flows = state.flows.filter(f =>
        f.accountId === acc.id && f.date > open.date && f.date <= close.date);
      const dep = flows.filter(f => f.kind === 'deposit').reduce((s, f) => s + (f.amount || 0), 0);
      const wd  = flows.filter(f => f.kind === 'withdraw').reduce((s, f) => s + (f.amount || 0), 0);
      res.deposits = dep; res.withdrawals = wd;
      res.profit = close.value - open.value - (dep - wd);

      // Cashflows in account currency (investor perspective) → XIRR
      const cfsLocal = [
        { date: rtDay(open.date), amount: -open.value },
        ...flows.map(f => ({ date: rtDay(f.date), amount: f.kind === 'deposit' ? -f.amount : f.amount })),
        { date: rtDay(close.date), amount: close.value },
      ];
      res.xirrLocal = rtXirr(cfsLocal);

      if (acc.currency === 'USD') {
        const rOpen = rtFx(state.fx, open.date), rClose = rtFx(state.fx, close.date);
        let ok = rOpen.rate != null && rClose.rate != null;
        let netFlowsILS = 0;
        const midFlowsILS = [];
        for (const f of flows) {
          const r = rtFx(state.fx, f.date);
          if (r.rate == null) { ok = false; break; }
          const signed = f.kind === 'deposit' ? f.amount : -f.amount;
          netFlowsILS += signed * r.rate;
          midFlowsILS.push({ date: rtDay(f.date), amount: (f.kind === 'deposit' ? -f.amount : f.amount) * r.rate });
        }
        if (ok) {
          res.openILS     = open.value * rOpen.rate;
          res.closeILS    = close.value * rClose.rate;
          res.netFlowsILS = netFlowsILS;
          res.profitILS   = res.closeILS - res.openILS - netFlowsILS;
          res.currencyEffect = res.profitILS - res.profit * rClose.rate;
          res.closeRate   = rClose.rate;
          res.flowsILS = [
            { date: rtDay(open.date), amount: -res.openILS },
            ...midFlowsILS,
            { date: rtDay(close.date), amount: res.closeILS },
          ];
          if (rOpen.approx || rClose.approx) res.warnings.push('שער דולר משוער (נלקחה הנקודה הקרובה ביותר)');
        } else {
          res.fxMissing = true;
          res.missing.push(`חסר שער דולר לתאריכי התקופה (${rtFmtDate(open.date)}–${rtFmtDate(close.date)})`);
        }
      } else {
        res.openILS = open.value;
        res.closeILS = close.value;
        res.netFlowsILS = dep - wd;
        res.profitILS = res.profit;
        res.flowsILS = cfsLocal;
      }
      res.ok = true;
      return res;
    }

    // ── Portfolio totals — always recomputed from raw records ──
    function rtComputePortfolio(state, filter, periodId) {
      const accounts = state.accounts
        .filter(a => a.active !== false)
        .filter(a => !filter.group || a.group === filter.group)
        .filter(a => !filter.owner || a.owner === filter.owner)
        .filter(a => !filter.account || a.id === filter.account);
      const ids = new Set(accounts.map(a => a.id));
      const period = rtPeriod(periodId, state, ids);
      const rows = accounts.map(a => rtComputeAccount(a, state, period));
      const complete = rows.filter(r => r.profitILS != null);
      const excluded = rows.filter(r => r.profitILS == null);

      const sum = k => complete.reduce((s, r) => s + (r[k] || 0), 0);
      const totals = complete.length ? {
        openILS: sum('openILS'), closeILS: sum('closeILS'),
        netFlowsILS: sum('netFlowsILS'), profitILS: sum('profitILS'),
        currencyEffect: complete.some(r => r.currencyEffect != null)
          ? complete.reduce((s, r) => s + (r.currencyEffect || 0), 0) : null,
        xirr: rtXirr(complete.flatMap(r => r.flowsILS || [])),
      } : null;

      // Dividends & fees — display-only breakdown (already inside closing values)
      let dividends = 0, fees = 0, hasIncome = false, incomeApprox = false;
      state.income
        .filter(i => ids.has(i.accountId) && (periodId === 'all' || String(i.year) === String(periodId)))
        .forEach(i => {
          const acc = accounts.find(a => a.id === i.accountId);
          let mult = 1;
          if (acc && acc.currency === 'USD') {
            const r = rtFx(state.fx, period.end);
            if (r.rate == null) { incomeApprox = true; return; }
            mult = r.rate; incomeApprox = true;
          }
          dividends += (i.dividends || 0) * mult;
          fees      += (i.fees || 0) * mult;
          hasIncome = true;
        });

      return { period, rows, complete, excluded, totals, dividends, fees, hasIncome, incomeApprox };
    }

    // ── Supabase (report archive) — loaded lazily from CDN, only if configured ──
    function rtSbCfg() {
      try { return JSON.parse(localStorage.getItem(RT_SB_KEY)) || null; } catch { return null; }
    }
    function rtSbSaveCfg(c) {
      try {
        if (c) localStorage.setItem(RT_SB_KEY, JSON.stringify(c));
        else localStorage.removeItem(RT_SB_KEY);
      } catch {}
    }
    let _rtSbClient = null;
    function rtLoadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.crossOrigin = 'anonymous';
        s.onload = resolve; s.onerror = () => reject(new Error('script load failed'));
        document.head.appendChild(s);
      });
    }
    async function rtSupabase() {
      const cfg = rtSbCfg();
      if (!cfg || !cfg.url || !cfg.anonKey) return null;
      if (_rtSbClient) return _rtSbClient;
      if (!window.supabase) {
        await rtLoadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js');
      }
      _rtSbClient = window.supabase.createClient(cfg.url, cfg.anonKey);
      return _rtSbClient;
    }

    function rtDownload(name, text, mime) {
      const blob = new Blob([text], { type: mime });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    // ── Error boundary: a crash in the returns screen must never take
    //    down "ההון שלי" ─────────────────────────────────
    class ReturnsErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error('Returns screen crashed:', error, info); }
      render() {
        if (this.state.error) {
          return (
            <div className="page-pad">
              <div className="panel-card" style={{ padding: '34px 30px', textAlign: 'center' }}>
                <div style={{ fontSize: 30, marginBottom: 10 }}>⚠️</div>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 6 }}>מסך התשואות נתקל בשגיאה</div>
                <div style={{ fontSize: 13, color: 'var(--ink-3)', marginBottom: 20 }}>
                  הנתונים שלך שמורים. ההון שלי ממשיך לעבוד כרגיל.
                </div>
                <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
                  <button className="rt-btn" onClick={this.props.onHome}>→ חזרה להון שלי</button>
                  <button className="rt-btn2" onClick={() => this.setState({ error: null })}>נסה שוב</button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ── Small shared pieces ──────────────────────────────
    function RtSheet({ title, onClose, children }) {
      return (
        <>
          <div className="rt-sheet-overlay" onClick={onClose} />
          <div className="rt-sheet" dir="rtl">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <div style={{ fontSize: 15, fontWeight: 700 }}>{title}</div>
              <button className="rt-mini-btn" onClick={onClose} title="סגור">✕</button>
            </div>
            {children}
          </div>
        </>
      );
    }

    function RtMoney({ v, cur = 'ILS', size = 14, bold, signColor, dark }) {
      const pos = v != null && v >= 0;
      const color = signColor
        ? (pos ? (dark ? 'var(--accent)' : '#047857') : (dark ? RT_NEG_DARK : RT_NEG))
        : undefined;
      return (
        <span className="rt-num" style={{ fontSize: size, fontWeight: bold ? 700 : 600, color }}>
          {rtFmt(v, cur, { sign: !!signColor })}
        </span>
      );
    }

    // ── The bottom line: the profit equation, as real bookkeeping ──
    function RtLedger({ result, onGoMissing, onGoEntry }) {
      const { totals, period, excluded, complete } = result;
      const hasData = complete.length > 0;
      const profit = totals ? totals.profitILS : null;
      const pos = profit != null && profit >= 0;
      const line = (label, v, op) => (
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '7px 0' }}>
          <span style={{ fontSize: 14, color: 'rgba(244,251,248,0.72)' }}>
            {op && <span className="rt-num" style={{ marginInlineEnd: 8, color: 'rgba(244,251,248,0.5)' }}>{op}</span>}
            {label}
          </span>
          {v != null
            ? <span className="rt-num" style={{ fontSize: 17, fontWeight: 600, color: '#fff' }}>
                {Math.round(v).toLocaleString('en-US')}
              </span>
            : <span className="rt-dashed rt-num" onClick={onGoEntry}
                style={{ color: 'rgba(244,251,248,0.55)', fontSize: 14 }}>הזן נתון</span>}
        </div>
      );
      return (
        <section className="hero-card anim-1" style={{ padding: '28px 30px 24px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 16 }}>
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase',
                           color: 'rgba(244,251,248,0.55)' }}>
              השורה התחתונה · {period.label}
            </span>
            <span className="rt-num" style={{ fontSize: 11, color: 'rgba(244,251,248,0.45)' }}>
              {rtFmtDate(period.start)} – {rtFmtDate(period.end)}
            </span>
          </div>

          {!hasData ? (
            <div style={{ padding: '14px 0 6px' }}>
              <div style={{ fontSize: 14, color: 'rgba(244,251,248,0.8)', marginBottom: 14 }}>
                אין עדיין מספיק נתונים לתקופה הזאת. צריך שווי פתיחה, שווי סגירה, ותנועות.
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                <button className="rt-btn" onClick={onGoEntry}>+ הזנת נתונים</button>
                {excluded.length > 0 && (
                  <button className="rt-btn2" style={{ background: 'transparent', color: 'rgba(244,251,248,0.85)',
                    borderColor: 'rgba(244,251,248,0.3)' }} onClick={onGoMissing}>
                    מה חסר? ({excluded.length})
                  </button>
                )}
              </div>
            </div>
          ) : (
            <div style={{ maxWidth: 470 }}>
              {line(`שווי ${rtFmtDate(period.end)}`, totals.closeILS, '')}
              {line(`שווי ${rtFmtDate(period.start)}`, totals.openILS, '−')}
              {line('הפקדות נטו', totals.netFlowsILS, '−')}
              <div style={{ borderTop: '1px solid rgba(244,251,248,0.35)', margin: '8px 0 10px' }} />
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{ fontSize: 15, fontWeight: 700, color: '#fff' }}>= רווח</span>
                <span style={{ display: 'flex', gap: 14, alignItems: 'baseline' }}>
                  {totals.xirr != null && (
                    <span className="rt-num" title="תשואה שנתית משוקללת כספית"
                      style={{ fontSize: 13, fontWeight: 700, color: pos ? 'var(--accent)' : RT_NEG_DARK }}>
                      {pos ? '▲' : '▼'} {rtFmtPct(totals.xirr)} XIRR
                    </span>
                  )}
                  <span className="rt-num" style={{ fontFamily: 'var(--serif)', fontSize: 32, fontWeight: 600,
                    color: pos ? 'var(--accent)' : RT_NEG_DARK }}>
                    {Math.round(profit).toLocaleString('en-US')}
                  </span>
                </span>
              </div>
              {excluded.length > 0 && (
                <button onClick={onGoMissing}
                  style={{ marginTop: 16, background: 'rgba(252,211,77,0.12)', color: '#FCD34D',
                    border: '1px solid rgba(252,211,77,0.35)', borderRadius: 999,
                    padding: '4px 13px', fontSize: 11, fontWeight: 600, cursor: 'pointer' }}>
                  ⚠ {excluded.length} חשבונות לא כלולים — חסרים נתונים
                </button>
              )}
            </div>
          )}
        </section>
      );
    }

    // ── Breakdown: currency · dividends · fees — quiet, report-like.
    //    These decompose the profit; they are never added to it. ──
    function RtBreakdown({ result }) {
      const { totals, dividends, fees, hasIncome, incomeApprox } = result;
      const rows = [];
      if (totals && totals.currencyEffect != null) {
        rows.push({ label: 'אפקט מטבע (דולר/שקל)', v: totals.currencyEffect, signed: true });
      }
      if (hasIncome) {
        rows.push({ label: `דיבידנדים${incomeApprox ? ' ≈' : ''}`, v: dividends, signed: false });
        rows.push({ label: `עמלות ודמי ניהול${incomeApprox ? ' ≈' : ''}`, v: -Math.abs(fees), signed: true });
      }
      if (!rows.length) return null;
      return (
        <section className="panel-card anim-2" style={{ padding: '18px 24px', marginTop: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase',
                        color: 'var(--ink-3)', marginBottom: 10 }}>פירוק הרווח</div>
          {rows.map(r => (
            <div key={r.label} className="rt-row">
              <span style={{ fontSize: 13, color: 'var(--ink-2)' }}>{r.label}</span>
              <RtMoney v={r.v} signColor={r.signed} size={13} />
            </div>
          ))}
          <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 10, lineHeight: 1.6 }}>
            * פירוק אינפורמטיבי בלבד — דיבידנדים ועמלות כבר כלולים בשווי הסגירה ואינם מתווספים לרווח.
          </div>
        </section>
      );
    }

    // ── Contribution to profit, per account ──────────────
    function RtContribution({ result, onPick }) {
      const rows = result.complete
        .filter(r => r.profitILS != null)
        .sort((a, b) => b.profitILS - a.profitILS);
      if (rows.length < 1) return null;
      const maxAbs = Math.max(...rows.map(r => Math.abs(r.profitILS)), 1);
      return (
        <section className="panel-card anim-2" style={{ padding: '18px 24px', marginTop: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase',
                        color: 'var(--ink-3)', marginBottom: 12 }}>תרומה לרווח לפי חשבון</div>
          {rows.map(r => {
            const pos = r.profitILS >= 0;
            const w = Math.max(2, Math.abs(r.profitILS) / maxAbs * 100);
            return (
              <div key={r.account.id} onClick={() => onPick(r.account.id)}
                style={{ padding: '8px 0', cursor: 'pointer' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
                  <span style={{ fontSize: 13, color: 'var(--ink)' }}>
                    {r.account.name}
                    {r.warnings.length > 0 && <span className="rt-warn" style={{ marginInlineStart: 8 }}>⚠</span>}
                  </span>
                  <span style={{ display: 'flex', gap: 10, alignItems: 'baseline' }}>
                    {r.xirrLocal != null && (
                      <span className="rt-num" style={{ fontSize: 11, color: 'var(--ink-3)' }}>
                        {rtFmtPct(r.xirrLocal)}
                      </span>
                    )}
                    <RtMoney v={r.profitILS} signColor size={13} />
                  </span>
                </div>
                <div style={{ height: 6, borderRadius: 999, background: 'var(--surface-2)', overflow: 'hidden',
                              display: 'flex', justifyContent: pos ? 'flex-start' : 'flex-end' }}>
                  <div style={{ width: `${w}%`, background: pos ? 'var(--accent)' : RT_NEG, borderRadius: 999 }} />
                </div>
              </div>
            );
          })}
        </section>
      );
    }

    // Recurring deposit generator — critical for קרן השתלמות
    function RtRecurringForm({ accounts, onCreate, onClose }) {
      const now = new Date();
      const curMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const [f, setF] = useState({
        accountId: (accounts[0] || {}).id || '', amount: '', kind: 'deposit',
        from: `${now.getFullYear()}-01`, to: curMonth, day: '10',
      });
      const set = (k, v) => setF(p => ({ ...p, [k]: v }));
      const build = () => {
        const amount = rtNum(f.amount);
        const day = Math.min(Math.max(parseInt(f.day) || 1, 1), 31);
        if (!f.accountId) return alert('בחר חשבון');
        if (amount == null || amount <= 0) return alert('חסר סכום');
        if (!f.from || !f.to || f.from > f.to) return alert('טווח חודשים לא תקין');
        const flows = [];
        let [y, m] = f.from.split('-').map(Number);
        const [ey, em] = f.to.split('-').map(Number);
        let guard = 0;
        while ((y < ey || (y === ey && m <= em)) && guard++ < 600) {
          const dim = new Date(y, m, 0).getDate(); // days in month
          const d = `${y}-${String(m).padStart(2, '0')}-${String(Math.min(day, dim)).padStart(2, '0')}`;
          flows.push({ accountId: f.accountId, date: d, amount, kind: f.kind });
          m++; if (m > 12) { m = 1; y++; }
        }
        if (!flows.length) return alert('לא נוצרו תנועות');
        if (!confirm(`ליצור ${flows.length} תנועות של ${rtFmt(amount)}?`)) return;
        onCreate(flows);
      };
      return (
        <RtSheet title="הפקדה חוזרת" onClose={onClose}>
          <RtFormRow>
            <div className="rt-field" style={{ flexBasis: '100%' }}>
              <label className="rt-label">חשבון</label>
              <RtAccountSelect accounts={accounts} value={f.accountId} onChange={v => set('accountId', v)} />
            </div>
          </RtFormRow>
          <RtFormRow>
            <div className="rt-field">
              <label className="rt-label">סכום חודשי</label>
              <input className="rt-input num" inputMode="decimal" value={f.amount}
                onChange={e => set('amount', e.target.value)} placeholder="0" />
            </div>
            <div className="rt-field">
              <label className="rt-label">סוג</label>
              <select className="rt-select" value={f.kind} onChange={e => set('kind', e.target.value)}>
                <option value="deposit">הפקדה</option>
                <option value="withdraw">משיכה</option>
              </select>
            </div>
            <div className="rt-field">
              <label className="rt-label">יום בחודש</label>
              <input className="rt-input num" inputMode="numeric" value={f.day}
                onChange={e => set('day', e.target.value)} />
            </div>
          </RtFormRow>
          <RtFormRow>
            <div className="rt-field">
              <label className="rt-label">מחודש</label>
              <input className="rt-input" type="month" value={f.from} onChange={e => set('from', e.target.value)} />
            </div>
            <div className="rt-field">
              <label className="rt-label">עד חודש (כולל)</label>
              <input className="rt-input" type="month" value={f.to} onChange={e => set('to', e.target.value)} />
            </div>
          </RtFormRow>
          <RtFormActions onSave={build} saveLabel="צור תנועות" />
        </RtSheet>
      );
    }
